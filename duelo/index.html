<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0812">
<meta name="screen-orientation" content="landscape">
<title>Meia-Noite</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0a0812; overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  /* #app é a "tela" do jogo. No celular em pé ele gira 90° para o jogo ficar deitado. */
  #app {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
    display: grid; place-items: center;
  }
  body.rotated #app {
    width: 100vh; width: 100dvh; height: 100vw;
    transform-origin: top left; transform: translateX(100vw) rotate(90deg);
  }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  .pad { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); display: none; gap: 10px; align-items: flex-end; }
  .pad.left { left: max(12px, env(safe-area-inset-left)); }
  .pad.right { right: max(12px, env(safe-area-inset-right)); grid-template-columns: repeat(2, auto); }
  body.touch .pad.left { display: flex; }
  body.touch .pad.right { display: grid; }
  .pad button {
    width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(214, 200, 255, 0.3);
    background: rgba(12, 9, 24, 0.5); color: #efe8ff; font: 700 11px/1 ui-monospace, Menlo, Consolas, monospace;
    touch-action: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .pad button svg { width: 24px; height: 24px; fill: #efe8ff; display: block; margin: auto; }
  .pad button.on { background: rgba(183, 156, 255, 0.35); border-color: #c9b6ff; }
  .pad button[data-key="guard"].on { background: rgba(255, 214, 102, 0.35); border-color: #ffd666; }
  .pad button[data-key="attack"] { width: 72px; height: 72px; }
  .back-btn {
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 10px; border-radius: 999px;
    border: 2px solid rgba(214, 200, 255, 0.3); background: rgba(12, 9, 24, 0.6); color: #efe8ff;
    font: 700 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: manipulation;
  }
  .back-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  body.touch .back-btn:not([hidden]) { display: flex; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="384" height="216" aria-label="Meia-Noite: duelo contra zumbis. Setas andam, espaço pula, J ataca, K defende, L solta o poder."></canvas>
  <div class="pad left" aria-hidden="true">
    <button data-key="left"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8z"/></svg></button>
    <button data-key="right"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8z"/></svg></button>
  </div>
  <div class="pad right" aria-hidden="true">
    <button data-key="power">PODER</button>
    <button data-key="jump">PULAR</button>
    <button data-key="guard">DEFESA</button>
    <button data-key="attack">ATAQUE</button>
  </div>
  <button id="back-btn" class="back-btn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Menu</span></button>
</div>

  // =====================================================================

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const touch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  document.body.classList.toggle('touch', touch);
  function fit() {
    const portrait = window.innerHeight > window.innerWidth;
    const rotate = touch && portrait;
    document.body.classList.toggle('rotated', rotate);
    const aw = rotate ? window.innerHeight : window.innerWidth;
    const ah = rotate ? window.innerWidth : window.innerHeight;
    const s0 = Math.min(aw / W, ah / H);
    const s = s0 >= 2 && !touch ? Math.floor(s0) : s0;
    canvas.style.width = Math.round(W * s) + 'px';
    canvas.style.height = Math.round(H * s) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 50));
  fit();
  // tenta travar deitado quando o sistema deixa (tela cheia); se não der, a rotação acima resolve
  function tryLandscape() {
    if (!touch) return;
    try {
      const el = document.documentElement;
      const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : null;
      Promise.resolve(p).then(() => screen.orientation?.lock?.('landscape')).catch(() => {}).finally(() => setTimeout(fit, 100));

  }

  function tinted(im, color) {
    const c = document.createElement('canvas');
    c.width = im.width; c.height = im.height;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = color;
    g.fillRect(0, 0, c.width, c.height);
    return c;
  }

    sheets[name] = s;

    const [ax, ay] = a.anchor;

    ctx.save();

    ctx.translate(Math.round(x), Math.round(y));

  const ACCENTS = {

    'Ú': ['U', [[2, -2], [1, -1]]], 'Ç': ['C', [[1, 5], [0, 6]]],
  };
  const textWidth = (str, s = 1) => str.length * 4 * s - s;
  function drawText(str, x, y, { s = 1, color = C.text, align = 'left', shadow = C.ink } = {}) {
    str = String(str).toUpperCase();
    if (align === 'center') x -= Math.floor(textWidth(str, s) / 2);
    if (align === 'right') x -= textWidth(str, s);
    x = Math.round(x); y = Math.round(y);
    const pass = (ox, oy, col) => {
      ctx.fillStyle = col;
      for (let i = 0; i < str.length; i++) {
        let ch = str[i];
        let marks = null;

        const g = GLYPHS[ch] || GLYPHS['?'];

        for (let p = 0; p < 15; p++) if (g[p] === '1') ctx.fillRect(cx + (p % 3) * s, y + Math.floor(p / 3) * s + oy, s, s);
        if (marks) for (const [mx, my] of marks) ctx.fillRect(cx + mx * s, y + my * s + oy, s, s);
      }
    };
    if (shadow) pass(s, s, shadow);
    pass(0, 0, color);
  }

    setZombieState(z, kind === 'combo' ? 'combo' : kind === 'leap' ? 'leap' : 'attack');
    sfx(kind === 'leap' ? 'leap' : 'growl');
  }

  function stepZombie(z) {
    z.t++;
    if (z.flash > 0) z.flash--;
    z.x += z.kx;
    z.kx *= 0.8;
    z.x = Math.max(12, Math.min(W - 12, z.x));
    z.postureCD++;
    if (z.state !== 'stun' && z.postureCD > 150 && z.posture < POSTURE_MAX) z.posture = Math.min(POSTURE_MAX, z.posture + 0.3);
    if (z.posture >= POSTURE_MAX) z.barAlpha = Math.max(0, z.barAlpha - 0.03);

    const dx = hero.x - z.x;
    const dist = Math.abs(dx);
    const maxAtk = Math.min(2, zombieCount(game.wave));

    switch (z.state) {
      case 'spawn': {
        if (z.t === 1) { sfx('rise'); puff(z.x, z.y - 4, 18, 'rgba(120,100,180,0.8)', 1.6, 26, -0.02); }
        if (z.t > 0 && z.t % 6 === 0) puff(z.x + (Math.random() - 0.5) * 20, z.y - 2, 3, 'rgba(120,100,180,0.7)', 0.6, 20, -0.03);
        if (z.t >= 46) setZombieState(z, 'idle');
        break;
      }
      case 'idle': case 'walk': case 'run': {
        z.face = Math.sign(dx) || z.face;
        if (hero.state === 'dead' || !game.ai) { z.state = 'idle'; break; }
        if (z.cooldown > 0) z.cooldown--;
        if (hero.state === 'attack' && hero.t === 1 && dist < 50 && Math.random() < z.guardChance) { setZombieState(z, 'guard'); break; }
        const canAttack = z.cooldown <= 0 && attackers() < maxAtk;
        if (canAttack && dist < 46) { startZombieAttack(z, Math.random() < z.comboChance ? 'combo' : 'slow'); break; }
        if (canAttack && dist > 70 && dist < 150 && Math.random() < z.leapChance * 0.04) { startZombieAttack(z, 'leap'); break; }
        let want = 'idle', v = 0;
        // quem não pode atacar agora fica rondando a uma distância
        const keep = !canAttack && attackers() >= maxAtk ? 70 : 34;
        if (dist > 120) { want = 'run'; v = 1.7; }
        else if (dist > keep) { want = 'walk'; v = z.speed; }
        else if (dist < keep - 16) { want = 'walk'; v = -z.speed * 0.6; }
        if (z.state !== want) { z.state = want; z.f = 0; z.ft = 0; }
        z.x += z.face * v;
        const rate = want === 'run' ? 5 : want === 'walk' ? 7 : 10;
        if (++z.ft >= rate) { z.ft = 0; z.f++; }
        break;
      }
      case 'attack': case 'combo': case 'leap': {
        const a = z.atk;
        if (z.state === 'leap') {
          // salto em arco até perto do herói
          if (a.air.includes(a.frames[z.f])) {
            if (z.f === a.air[0] && z.ft === 0) { z.vy = -4.4; z.leapV = Math.max(-5.2, Math.min(5.2, (hero.x - z.face * 24 - z.x) / 20)); }
            z.x += z.leapV || 0;
          }
          z.vy += 0.42;
          z.y = Math.min(GROUND, z.y + z.vy);
          if (z.y >= GROUND) { z.y = GROUND; if (z.f >= 2 && z.f < 4) { z.f = 4; z.ft = 0; } }
        } else if (z.f < 2) z.x += z.face * 0.4;
        const hit = a.hits[a.frames[z.f]];
        if (hit && !z.hitFrames[z.f] && z.ft === 0) {
          z.hitFrames[z.f] = true;
          sfx(z.state === 'leap' ? 'thud' : 'swing');
          if (z.state === 'leap') { game.shake = 5; puff(z.x, z.y - 2, 14, 'rgba(160,140,230,0.8)', 2, 14); }
          const back = hit.back || 0;
          const reach = { x: z.face > 0 ? z.x - back : z.x - hit.reach, y: z.y - 34, w: hit.reach + back, h: 32 };
          if (overlaps(reach, heroBox())) zombieHitsHero(z, hit);
          if (z.state === 'stun') break;
        }
        if (advance(z, a.dur) && z.f >= a.frames.length) {
          setZombieState(z, 'idle');
          z.y = GROUND;
          z.cooldown = Math.max(14, 50 - game.wave * 5) + Math.floor(Math.random() * 30);
        }
        break;
      }
      case 'guard': {
        if (z.t > 26 || (z.guardHits || 0) >= 3) { setZombieState(z, 'idle'); z.guardHits = 0; z.cooldown = 0; }
        break;
      }
      case 'hurt': {
        if (z.t > 10) { setZombieState(z, 'idle'); z.cooldown = Math.max(z.cooldown, 12); }
        break;
      }
      case 'stun': {
        if (z.t > 150) { setZombieState(z, 'idle'); z.posture = POSTURE_MAX; z.cooldown = 30; }
        break;
      }
      case 'dead': {
        z.deadT++;
        break;
      }
    }
    // zumbis no chão não atravessam o herói nem uns aos outros
    if (z.state !== 'dead' && z.state !== 'spawn' && z.y >= GROUND - 6) {
      if (hero.y > z.y - 34 && hero.state !== 'power') {
        const d = z.x - hero.x;
        if (Math.abs(d) < MIN_GAP) z.x = hero.x + (d >= 0 ? MIN_GAP : -MIN_GAP);
      }
      for (const o of zombies) {
        if (o === z || o.state === 'dead' || o.state === 'spawn') continue;
        const d = z.x - o.x;
        if (Math.abs(d) < 18) z.x += (d >= 0 ? 1 : -1) * 0.8;
      }
      z.x = Math.max(12, Math.min(W - 12, z.x));
    }
  }

  function nextWave() {
    game.wave++;
    game.banner = 110;
    hero.hp = Math.min(hero.maxHp, hero.hp + 35);
    spawnWave();
    sfx('wave');
  }

  // =====================================================================
  // Passo
  // =====================================================================
  function step() {
    game.t++;
    particles = particles.filter((q) => { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; return q.life > 0; });
    if (game.shake > 0) game.shake--;
    if (game.flash > 0) game.flash--;
    if (game.banner > 0) game.banner--;
    if (game.comboT > 0 && --game.comboT === 0) game.combo = 0;

    if (game.mode === 'title') {
      if (pressed.jump || pressed.attack) startGame();
    } else if (game.mode === 'play') {
      // durante a pausa de impacto, o que for apertado fica guardado para o próximo quadro
      if (game.hitstop > 0) { game.hitstop--; return; }
      else {
        stepHero();
        if (game.mode === 'play') {
          for (const z of zombies) stepZombie(z);
          if (zombies.length && zombies.every((z) => z.state === 'dead')) {
            if (++game.waveT > 80) { game.waveT = 0; nextWave(); }
          }
        }
      }
    } else if (game.mode === 'over') {
      game.overT++;
      stepHero();
      for (const z of zombies) { z.t++; if (z.state !== 'dead') { z.state = 'idle'; } }
      if (game.overT > 60 && (pressed.jump || pressed.attack)) startGame();
    }
    for (const k in pressed) pressed[k] = false;
  }

  // =====================================================================
  // Desenho
  // =====================================================================
  function heroFrame() {
    const h = hero;
    switch (h.state) {
      case 'attack': return [h.st.anim, h.st.frames[Math.min(h.f, h.st.frames.length - 1)]];
      case 'guard': return ['guard', Math.min(h.f, 3)];
      case 'hurt': return ['fall', 1];
      case 'power': return ['power', Math.min(h.f, 6)];
      case 'dead': return ['death', Math.min(6, Math.floor(h.deadT / 8))];
    }
    if (!h.onGround) return h.vy < 0 ? ['jump', h.airT < 4 ? 1 : h.vy < -3 ? 2 : 3] : h.vy < 2 ? ['jump', 4] : ['fall', Math.floor(h.airT / 5) % 5];
    if (h.landT > 0 && Math.abs(h.vx) < 0.5) return ['land', 1 + Math.min(3, Math.floor((10 - h.landT) / 3))];
    if (Math.abs(h.vx) > 1.4) return ['run', Math.floor(h.runT / 4) % 7];
    if (Math.abs(h.vx) > 0.3) return ['walk', Math.floor(h.runT / 5) % 7];
    return ['idle', Math.floor(game.t / 10) % 5];
  }
  function zombieFrame(z) {
    switch (z.state) {
      case 'walk': return ['walk', z.f % 8];
      case 'run': return ['run', z.f % 6];
      case 'attack': case 'combo': case 'leap': return [z.atk.anim, z.atk.frames[Math.min(z.f, z.atk.frames.length - 1)]];
      case 'guard': return ['guard', Math.min(3, Math.floor(z.t / 3))];
      case 'hurt': return ['stun', 0];
      case 'stun': return ['stun', z.t < 18 ? Math.floor(z.t / 6) : 3 + (Math.floor(z.t / 10) % 2)];
      case 'dead': return ['death', Math.min(4, Math.floor(z.deadT / 7))];
    }
    return ['idle', Math.floor((game.t + z.id * 13) / 10) % 7];
  }
  function drawBar(x, y, w, h, frac, color, back = C.hpBack) {
    ctx.fillStyle = C.ink; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = back; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color; ctx.fillRect(x, y, Math.round(w * Math.max(0, Math.min(1, frac))), h);
  }

  function drawZombie(z, t) {
    if (z.state === 'spawn') {
      // surge do chão: a arte grande do zumbi sobe da fumaça
      if (z.t <= 0) return;
      const k = Math.min(1, z.t / 46);
      ctx.save();
      ctx.beginPath();
      ctx.rect(z.x - 40, 0, 80, GROUND + 1);
      ctx.clip();
      drawSprite('zombie', 'rise', 0, z.x, GROUND + 26 * (1 - k), z.face, { alpha: Math.min(1, k * 1.4), scale: 0.62 });
      ctx.restore();
      return;
    }
    const [za, zf] = zombieFrame(z);
    const alpha = z.state === 'dead' ? Math.max(0, 1 - Math.max(0, z.deadT - 45) / 40) : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(Math.round(z.x - 10), GROUND - 1, 20, 2);
    drawSprite('zombie', za, zf, z.x, z.y, z.face, { alpha });
    if (z.flash > 0) drawSprite('zombie', za, zf, z.x, z.y, z.face, { tint: 'white', alpha: 0.16 * alpha }); // flash bem fraco
    // aviso antes do golpe: brilho vermelho no olho (duplo antes da sequência rápida, triplo antes do salto)
    if (z.atk && ['attack', 'combo', 'leap'].includes(z.state) && z.atk.tell.includes(z.atk.frames[z.f])) {
      const gx = z.x + z.face * 5, gy = z.y - 33;
      const n = z.state === 'slow' || z.state === 'attack' ? 1 : z.state === 'combo' ? 2 : 3;
      ctx.fillStyle = 'rgba(255,59,78,0.3)';
      ctx.fillRect(gx - 3, gy - 3, 7, 7);
      ctx.fillStyle = (t >> 2) % 2 ? '#ff3b4e' : '#ffb3bb';
      ctx.fillRect(gx - 1, gy - 1, 3, 3);
      if (n >= 2) { ctx.fillRect(gx - 5, gy, 1, 1); ctx.fillRect(gx + 5, gy, 1, 1); }
      if (n >= 3) { ctx.fillRect(gx, gy - 5, 1, 1); }
    }
    if (z.barAlpha > 0 && z.state !== 'dead') {
      ctx.globalAlpha = z.barAlpha;
      const bw = 30, bx = Math.round(z.x - bw / 2), by = Math.round(z.y - 50);
      drawBar(bx, by, bw, 3, z.posture / POSTURE_MAX, z.state === 'stun' ? ((t >> 3) % 2 ? C.yellow : C.red) : C.red, C.redDark);
      ctx.globalAlpha = 1;
    }
    if (z.state === 'stun') drawText('ATORDOADO!', z.x, z.y - 60, { align: 'center', color: (t >> 3) % 2 ? C.yellow : C.yellowHot });
  }

  function drawHero(t) {
    const h = hero;
    const [ha, hf] = heroFrame();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(Math.round(h.x - 8), GROUND - 1, 16, 2);
    const blink = h.inv > 0 && h.inv < 900 && (h.inv >> 2) % 2 && h.state !== 'dead';
    const ox = h.blockShake ? (h.blockShake % 2 ? 1 : -1) : 0;
    if (!blink) drawSprite('hero', ha, hf, h.x + ox, h.y, h.face);
    if (h.parryT > 0) {
      // flash amarelo na defesa: o corpo só esquenta, o arco da defesa acende forte
      const k = h.parryT / 14;
      drawSprite('hero', ha, hf, h.x, h.y, h.face, { tint: 'yellow', alpha: 0.3 * k });
      const cx = h.x + h.face * 6, cy = h.y - 20;
      ctx.save();
      ctx.globalAlpha = k;
      ctx.lineWidth = 3;
      ctx.strokeStyle = C.yellow;
      ctx.beginPath();
      ctx.arc(cx, cy, 15 - k * 3, h.face > 0 ? -1.1 : Math.PI - 1.1, h.face > 0 ? 1.1 : Math.PI + 1.1);
      ctx.stroke();
      ctx.lineWidth = 1;
      ctx.strokeStyle = C.yellowHot;
      ctx.beginPath();
      ctx.arc(cx, cy, 15 - k * 3, h.face > 0 ? -0.9 : Math.PI - 0.9, h.face > 0 ? 0.9 : Math.PI + 0.9);
      ctx.stroke();
      const sx = Math.round(cx + h.face * (16 - k * 3)), sy = Math.round(cy), r = Math.round(2 + k * 5);
      ctx.fillStyle = C.yellowHot;
      ctx.fillRect(sx - r, sy, r * 2 + 1, 1);
      ctx.fillRect(sx, sy - r, 1, r * 2 + 1);
      ctx.restore();
    }
  }

  function render() {
    const t = game.t;
    ctx.save();
    if (game.shake) ctx.translate(Math.round((Math.random() * 2 - 1) * 2), Math.round((Math.random() * 2 - 1) * 2));
    ctx.drawImage(bg, 0, 0);
    if (game.mode !== 'title' && hero) {
      for (const z of zombies) if (z.state === 'dead') drawZombie(z, t);
      for (const z of zombies) if (z.state !== 'dead') drawZombie(z, t);
      drawHero(t);
    }
    for (const q of particles) {
      ctx.fillStyle = q.color;
      if (q.streak) ctx.fillRect(Math.round(q.x), Math.round(q.y), Math.abs(q.vx) > 1 ? 3 : 1, 1);
      else ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 1);
    }
    ctx.restore();
    if (game.flash > 0) {
      ctx.globalAlpha = game.flash / 30;
      ctx.fillStyle = game.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    if (game.mode === 'title') return drawTitle(t);

    const h = hero;
    drawText('VIDA', 8, 8, { color: C.dim });
    drawBar(30, 8, 80, 5, h.hp / h.maxHp, h.hp < 35 ? C.red : C.hp);
    drawText('PODER', 8, 18, { color: C.dim });
    const full = h.power >= 100;
    drawBar(30, 18, 80, 4, h.power / 100, full ? ((t >> 3) % 2 ? C.lilacHot : C.lilac) : C.power);
    if (full) drawText(touch ? 'PODER PRONTO' : 'L - PODER PRONTO', 116, 17, { color: (t >> 3) % 2 ? C.lilacHot : C.accent });
    drawText(`ONDA ${game.wave}`, W - 8, 8, { align: 'right' });
    const left = alive().length;
    if (left > 1) drawText(`${left} ZUMBIS`, W - 8, 18, { align: 'right', color: C.dim });
    if (game.combo >= 2) drawText(`${game.combo} ACERTOS`, W - 8, 28, { align: 'right', color: (game.comboT >> 2) % 2 ? C.lilacHot : C.accent, s: game.combo >= 8 ? 2 : 1 });
    if (game.banner > 0) {
      ctx.globalAlpha = Math.min(1, game.banner / 30);
      drawText(`ONDA ${game.wave}`, W / 2, 50, { s: 4, align: 'center' });
      const n = zombieCount(game.wave);
      if (game.wave === 1) {
        drawText('DEFENDA NA HORA DO GOLPE PARA DAR PARRY', W / 2, 76, { align: 'center', color: C.yellow });
        drawText('O PODER CARREGA ATACANDO E DEFENDENDO', W / 2, 86, { align: 'center', color: C.dim });
      } else if (n > 1) drawText(`${n} ZUMBIS DE UMA VEZ`, W / 2, 76, { align: 'center', color: C.red });
      ctx.globalAlpha = 1;
    }
    if (game.mode === 'over') {
      ctx.fillStyle = `rgba(11,9,20,${Math.min(0.78, game.overT / 70)})`;
      ctx.fillRect(0, 0, W, H);
      if (game.overT > 40) {
        drawText('VOCÊ CAIU', W / 2, 60, { s: 4, align: 'center', color: C.red });
        drawText(`CHEGOU ATÉ A ONDA ${game.wave}  -  ${game.kills} ZUMBIS`, W / 2, 92, { align: 'center' });
        drawText(`MAIOR SEQUÊNCIA: ${game.best} ACERTOS`, W / 2, 104, { align: 'center', color: C.dim });
        if (game.overT > 60 && (t >> 5) % 2 === 0) drawText(touch ? 'TOQUE PARA LUTAR DE NOVO' : 'ESPAÇO PARA LUTAR DE NOVO', W / 2, 136, { align: 'center', color: C.accent });
      }
    }
  }

  function drawTitle(t) {
    ctx.fillStyle = 'rgba(11,9,20,0.5)';
    ctx.fillRect(0, 0, W, H);
    drawText('MEIA-NOITE', W / 2, 24, { s: 5, align: 'center' });
    drawText('UM DUELO CONTRA OS MORTOS', W / 2, 54, { align: 'center', color: C.accent });
    drawSprite('hero', 'idle', Math.floor(t / 10) % 5, W / 2 - 60, 150, 1, { scale: 1.6 });
    drawSprite('zombie', 'rise', 0, W / 2 + 70, 156, -1, { scale: 0.95 });
    if ((t >> 5) % 2 === 0) drawText(touch ? 'TOQUE PARA LUTAR' : 'APERTE ESPAÇO PARA LUTAR', W / 2, 166, { align: 'center' });
    if (!touch) drawText('SETAS ANDAM  -  ESPAÇO PULA  -  J ATACA  -  K DEFENDE  -  L PODER', W / 2, 184, { align: 'center', color: C.dim });
    drawText('ATAQUE VÁRIAS VEZES PARA FAZER COMBO  -  DEFENDA NA HORA CERTA PARA DAR PARRY', W / 2, 196, { align: 'center', color: C.dim });
  }

  // =====================================================================
  // Entrada
  // =====================================================================
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
    KeyJ: 'attack', KeyX: 'attack', KeyZ: 'attack',
    KeyK: 'guard', KeyC: 'guard', ShiftLeft: 'guard',
    KeyL: 'power', KeyV: 'power',
  };
  function setKey(k, down) {
    if (down && !keys[k] && k in pressed) pressed[k] = true;
    keys[k] = down;
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyM') { muted = !muted; return; }
    if (e.code === 'Escape' && game.mode !== 'title') { e.preventDefault(); goMenu(); return; }
    const k = KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (!e.repeat) setKey(k, true);
  });
  window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) setKey(k, false); });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.querySelectorAll('.pad button').forEach((b) => {
    const k = b.dataset.key;
    const on = (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch {} b.classList.add('on'); setKey(k, true); };
    const off = (e) => { e.preventDefault(); b.classList.remove('on'); setKey(k, false); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  });
  canvas.addEventListener('pointerdown', () => {
    if (game.mode === 'title') { tryLandscape(); pressed.attack = true; }
    else if (game.mode === 'over' && game.overT > 60) pressed.attack = true;
  });
  const backBtn = document.getElementById('back-btn');
  function goMenu() {
    for (const k in keys) keys[k] = false;
    document.querySelectorAll('.pad button.on').forEach((b) => b.classList.remove('on'));
    game.mode = 'title';
  }
  backBtn.addEventListener('click', goMenu);

  // =====================================================================
  // Laço com passo fixo
  // =====================================================================
  let last = performance.now();
  let acc = 0;
  let paused = false;
  function frame(now) {
    requestAnimationFrame(frame);
    const showBack = game.mode !== 'title';
    if (backBtn.hidden === showBack) backBtn.hidden = !showBack;
    if (paused) { last = now; return; }
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= DT) { step(); acc -= DT; }
    render();
  }
  requestAnimationFrame(frame);

  // quadros até o próximo golpe do zumbi sair (para os testes)
  function ticksToNextHit(z) {
    if (!z || !['attack', 'combo', 'leap'].includes(z.state)) return null;
    const a = z.atk;
    let n = 0;
    for (let f = z.f; f < a.frames.length; f++) {
      if (a.hits[a.frames[f]] && !z.hitFrames[f] && !(f === z.f && z.ft > 0)) return n;
      n += a.dur[f] - (f === z.f ? z.ft : 0);
    }
    return null;
  }

  // Gancho para testes automatizados
  window.duelo = {
    pause() { paused = true; },
    resume() { paused = false; },
    start() { startGame(); for (const z of zombies) { z.t = 46; setZombieState(z, 'idle'); } },
    key(k, down) { setKey(k, down); },
    tap(k) { setKey(k, true); step(); setKey(k, false); },
    step(n = 1) { for (let i = 0; i < n; i++) step(); render(); },
    ai(on) { game.ai = on; },
    zombieAttack(kind, i = 0) { startZombieAttack(zombies[i], kind); },
    // arena com `n` zumbis já em pé
    only(n = 1) { zombies = zombies.slice(0, n); },
    wave(n) { game.wave = n; spawnWave(); },
    place(hx, zx) { hero.x = hx; zombies[0].x = zx; hero.face = Math.sign(zx - hx) || 1; zombies[0].face = -hero.face; },
    set(obj) { Object.assign(hero, obj.hero || {}); Object.assign(zombies[0], obj.zombie || {}); },
    sounds() { return soundLog.slice(); },
    clearSounds() { soundLog.length = 0; },
    state() {
      const zs = (z) => z && { nextHit: ticksToNextHit(z), x: z.x, y: z.y, hp: z.hp, posture: z.posture, barAlpha: z.barAlpha, state: z.state, f: z.f, flash: z.flash, anim: z.state === 'spawn' ? 'rise' : zombieFrame(z)[0] };
      return {
        mode: game.mode, wave: game.wave, kills: game.kills, hitstop: game.hitstop, combo: game.combo, rotated: document.body.classList.contains('rotated'),
        hero: hero && { x: hero.x, y: hero.y, hp: hero.hp, maxHp: hero.maxHp, power: hero.power, state: hero.state, step: hero.step, f: hero.f, parryT: hero.parryT, face: hero.face, anim: heroFrame()[0] },
        zombie: zs(zombies[0]),
        zombies: zombies.map(zs),
        ready: Object.values(sheets).every((s) => s.ready),
      };
    },
  };
}
</script>
