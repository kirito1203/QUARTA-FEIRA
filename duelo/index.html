<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0812">
<title>Meia-Noite</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0a0812; overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  body { display: grid; place-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  .pad { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); display: none; gap: 12px; align-items: flex-end; }
  .pad.left { left: max(14px, env(safe-area-inset-left)); }
  .pad.right { right: max(14px, env(safe-area-inset-right)); display: none; grid-template-columns: repeat(2, auto); }
  @media (pointer: coarse) { .pad.left { display: flex; } .pad.right { display: grid; } }
  .pad button {
    width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(214, 200, 255, 0.3);
    background: rgba(12, 9, 24, 0.55); color: #efe8ff; font: 700 12px/1 ui-monospace, Menlo, Consolas, monospace;
    touch-action: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .pad button svg { width: 24px; height: 24px; fill: #efe8ff; display: block; margin: auto; }
  .pad button.on { background: rgba(183, 156, 255, 0.35); border-color: #c9b6ff; }
  .pad button[data-key="guard"].on { background: rgba(255, 214, 102, 0.35); border-color: #ffd666; }
  .pad button[data-key="power"] { border-color: rgba(183, 156, 255, 0.6); }
  .back-btn {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 6px; height: 38px; padding: 0 16px 0 12px; border-radius: 999px;
    border: 2px solid rgba(214, 200, 255, 0.3); background: rgba(12, 9, 24, 0.6); color: #efe8ff;
    font: 700 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: manipulation;
  }
  .back-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  @media (pointer: coarse) { .back-btn:not([hidden]) { display: flex; } }
</style>
</head>

<canvas id="game" width="384" height="216" aria-label="Meia-Noite: duelo contra zumbis. Setas andam, espaço pula, J ataca, K defende, L solta o poder."></canvas>

  <button data-key="left"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8z"/></svg></button>

</div>
<div class="pad right" aria-hidden="true">

  <button data-key="attack">ATAQUE</button>
</div>

  function tinted(im, color) {
    const c = document.createElement('canvas');

    G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
    M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101',
    S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
    Y: '101101010010010', Z: '111001010100111', 0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
    4: '101101111001001', 5: '111100110001110', 6: '011100110101010', 7: '111001010010010', 8: '010101010101010', 9: '010101011001110',
    ':': '000010000010000', '.': '000000000000010', '!': '010010010000010', '?': '110001010000010', '-': '000000111000000', '/': '001001010100100',
    ',': '000000000010100', '<': '001010100010001', '>': '100010001010100', ' ': '000000000000000', "'": '010010000000000', '+': '000010111010000', 'X': '101101010101101',
  };
  const ACCENTS = {
    'Á': ['A', [[2, -2], [1, -1]]], 'Â': ['A', [[0, -1], [1, -2], [2, -1]]], 'Ã': ['A', [[0, -1], [1, -2], [2, -2]]], 'É': ['E', [[2, -2], [1, -1]]],
    'Ê': ['E', [[0, -1], [1, -2], [2, -1]]], 'Í': ['I', [[2, -2], [1, -1]]], 'Ó': ['O', [[2, -2], [1, -1]]], 'Õ': ['O', [[0, -1], [1, -2], [2, -2]]],
    'Ú': ['U', [[2, -2], [1, -1]]], 'Ç': ['C', [[1, 5], [0, 6]]],
  };
  const textWidth = (str, s = 1) => str.length * 4 * s - s;
  function drawText(str, x, y, { s = 1, color = C.text, align = 'left', shadow = C.ink } = {}) {
    str = String(str).toUpperCase();
    if (align === 'center') x -= Math.floor(textWidth(str, s) / 2);
    if (align === 'right') x -= textWidth(str, s);
    x = Math.round(x); y = Math.round(y);
    const pass = (ox, oy, col) => {
      ctx.fillStyle = col;
      for (let i = 0; i < str.length; i++) {
        let ch = str[i];
        let marks = null;
        if (ACCENTS[ch]) [ch, marks] = ACCENTS[ch];
        const g = GLYPHS[ch] || GLYPHS['?'];
        const cx = x + i * 4 * s + ox;
        for (let p = 0; p < 15; p++) if (g[p] === '1') ctx.fillRect(cx + (p % 3) * s, y + Math.floor(p / 3) * s + oy, s, s);
        if (marks) for (const [mx, my] of marks) ctx.fillRect(cx + mx * s, y + my * s + oy, s, s);
      }
    };
    if (shadow) pass(s, s, shadow);
    pass(0, 0, color);
  }

  // =====================================================================
  // Som (sintetizado)
  // =====================================================================
  let audio = null;
  let muted = false;
  const soundLog = []; // para os testes
  function sfx(kind) {
    soundLog.push(kind);
    if (soundLog.length > 200) soundLog.shift();
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const t = audio.currentTime;
      const tone = (type, f0, f1, dur, vol, delay = 0) => {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, t + delay);
        o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + delay + dur);
        g.gain.setValueAtTime(vol, t + delay);
        g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
        o.connect(g).connect(audio.destination);
        o.start(t + delay);
        o.stop(t + delay + dur + 0.02);
      };
      const noise = (dur, vol, f0 = 1200, f1 = 300) => {
        const len = Math.floor(audio.sampleRate * dur);
        const buf = audio.createBuffer(1, len, audio.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = audio.createBufferSource();
        src.buffer = buf;
        const f = audio.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.setValueAtTime(f0, t);
        f.frequency.exponentialRampToValueAtTime(f1, t + dur);
        const g = audio.createGain();
        g.gain.value = vol;
        src.connect(f).connect(g).connect(audio.destination);
        src.start(t);
      };
      const S = {
        swing: () => noise(0.12, 0.25, 2400, 600),
        hit: () => { tone('square', 160, 60, 0.09, 0.07); noise(0.06, 0.2, 900, 300); },
        // parry: metálico e brilhante, bem diferente do resto
        parry: () => { tone('triangle', 1760, 1700, 0.35, 0.09); tone('triangle', 2640, 2600, 0.28, 0.06); tone('square', 880, 860, 0.06, 0.05); noise(0.05, 0.25, 5000, 3000); },
        block: () => { tone('square', 220, 160, 0.08, 0.06); noise(0.05, 0.15, 1500, 800); },
        zguard: () => tone('square', 300, 250, 0.05, 0.04),
        break: () => { [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, 0.16, 0.07, i * 0.05)); noise(0.25, 0.25, 3000, 400); },
        hurt: () => { tone('sawtooth', 260, 70, 0.3, 0.07); noise(0.1, 0.2, 700, 200); },
        growl: () => tone('sawtooth', 90, 60, 0.35, 0.035),
        power: () => { tone('sawtooth', 200, 1200, 0.25, 0.05); noise(0.35, 0.3, 4000, 600); },
        ready: () => [784, 1175].forEach((f, i) => tone('triangle', f, f, 0.12, 0.05, i * 0.08)),
        boom: () => { tone('sine', 120, 40, 0.5, 0.12); noise(0.4, 0.35, 900, 120); },
        die: () => tone('sawtooth', 180, 40, 0.8, 0.06),
        jump: () => tone('square', 240, 520, 0.1, 0.04),
        start: () => [440, 554, 659].forEach((f, i) => tone('square', f, f, 0.08, 0.04, i * 0.08)),
        wave: () => [330, 440].forEach((f, i) => tone('triangle', f, f, 0.2, 0.05, i * 0.12)),
      };
      S[kind]?.();
    } catch {}
  }

  // =====================================================================
  // Cenário: cemitério à meia-noite

  const bg = document.createElement('canvas');
  bg.width = W; bg.height = H;
  {
    const b = bg.getContext('2d');
    const g = b.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#06050d'); g.addColorStop(0.55, '#16122d'); g.addColorStop(0.85, '#2c2350'); g.addColorStop(1, '#3a2e63');
    b.fillStyle = g; b.fillRect(0, 0, W, H);
    for (let i = 0; i < 70; i++) {
      b.fillStyle = i % 9 === 0 ? 'rgba(243,238,255,0.9)' : 'rgba(243,238,255,0.45)';
      b.fillRect((i * 151 + 17) % W, (i * 67 + 5) % 120, 1, 1);
    }
    // lua cheia, levemente avermelhada
    const mx = 300, my = 48;
    for (let r = 46; r > 22; r -= 6) { b.fillStyle = `rgba(214,190,255,${0.03 + (46 - r) * 0.006})`; b.beginPath(); b.arc(mx, my, r, 0, 7); b.fill(); }
    b.fillStyle = '#f1e9ff'; b.beginPath(); b.arc(mx, my, 20, 0, 7); b.fill();
    b.fillStyle = '#d4c6f0';
    for (const [cx, cy, r] of [[-6, -5, 4], [6, 5, 3], [7, -8, 2], [-3, 9, 2]]) { b.beginPath(); b.arc(mx + cx, my + cy, r, 0, 7); b.fill(); }
    // igreja em ruínas e colinas
    const ridge = (base, amp, step, seed, color) => {
      b.fillStyle = color; let h = base;
      for (let x = 0; x < W; x += step) {
        h += Math.sin(x * 0.04 + seed) * amp + Math.sin(x * 0.11 + seed * 2) * amp * 0.4;
        h = Math.max(base - 30, Math.min(base + 10, h));
        b.fillRect(x, Math.round(h), step, H);
      }
    };

    b.fillStyle = '#1b1733';

      b.fillRect(x, base - h, 3, h);
      for (let k = 0; k < 4; k++) {

    // lápides
    const stone = (x, base, w, h) => {
      b.fillStyle = '#231d3d'; b.fillRect(x, base - h, w, h); b.fillRect(x + 1, base - h - 2, w - 2, 2);
      b.fillStyle = '#332b55'; b.fillRect(x + 1, base - h, w - 3, 1); b.fillRect(x + w / 2 - 1, base - h + 3, 2, 5); b.fillRect(x + w / 2 - 3, base - h + 4, 6, 1);
    };
    [[44, 184, 10, 14], [104, 184, 9, 11], [150, 184, 12, 16], [250, 184, 10, 13], [300, 184, 8, 10], [334, 184, 11, 15]].forEach((a) => stone(...a));
    // névoa
    for (let y = 150; y < GROUND; y += 4) { b.fillStyle = `rgba(160,140,230,${0.015 + (y - 150) * 0.002})`; b.fillRect(0, y, W, 2); }
    // chão
    b.fillStyle = '#1a1530'; b.fillRect(0, GROUND, W, H - GROUND);
    b.fillStyle = '#2b2448';
    for (let y = GROUND + 6; y < H; y += 7) for (let x = ((y / 7) % 2) * 9; x < W; x += 18) b.fillRect(x, y, 16, 5);
    b.fillStyle = '#8d84c4'; b.fillRect(0, GROUND, W, 2);
    b.fillStyle = '#d8cff5'; b.fillRect(0, GROUND, W, 1);
    b.fillStyle = '#5b5196';
    for (let x = 3; x < W; x += 11) b.fillRect(x, GROUND - 1 - (x % 3 === 0 ? 1 : 0), 1, 1 + (x % 3 === 0 ? 1 : 0));
  }

  // =====================================================================
  // Estado
  // =====================================================================
  const keys = { left: false, right: false, jump: false, attack: false, guard: false, power: false };
  const pressed = { jump: false, attack: false, guard: false, power: false };

  const game = { mode: 'title', t: 0, wave: 1, kills: 0, hitstop: 0, shake: 0, flash: 0, flashColor: C.lilac, banner: 0, overT: 0, combo: 0, comboT: 0, best: 0, ai: true };
  let particles = [];
  let hero, zombie;

  function newHero() {
    return {
      x: 90, y: GROUND, vx: 0, vy: 0, face: 1, onGround: true, hp: 100, maxHp: 100, power: 0,
      state: 'move', st: null, f: 0, ft: 0, t: 0, inv: 0, guardT: 99, parryT: 0, runT: 0, airT: 0, landT: 0,
      step: 0, queued: false, hitDone: false, hurtT: 0, blockShake: 0,
    };
  }
  function newZombie(wave) {
    return {
      x: 300, y: GROUND, face: -1, hp: 90 + wave * 30, maxHp: 90 + wave * 30, posture: POSTURE_MAX, postureCD: 0, barAlpha: 0,
      state: 'idle', atk: null, f: 0, ft: 0, t: 0, cooldown: 70, flash: 0, kx: 0, hitFrames: {}, tell: 0, deadT: 0,
      speed: 0.5 + wave * 0.04, comboChance: Math.min(0.55, 0.3 + wave * 0.05), guardChance: Math.min(0.4, 0.15 + wave * 0.04),
    };
  }
  function startGame() {
    game.mode = 'play';
    game.hitstop = 0; game.shake = 0; game.flash = 0; game.comboT = 0;
    game.wave = 1;
    game.kills = 0;
    game.banner = 120;
    game.combo = 0;
    hero = newHero();
    zombie = newZombie(1);
    particles = [];
    sfx('start');
  }

  function puff(x, y, n, color, spread = 1.5, life = 16, grav = 0.04) {
    for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() * 2 - 1) * spread, vy: (Math.random() * 2 - 1.3) * spread * 0.7, life: life + Math.random() * 10, color, g: grav });
  }

  // =====================================================================
  // Herói
  // =====================================================================
  function heroBox() { return { x: hero.x - 7, y: hero.y - 36, w: 14, h: 36 }; }
  function zombieBox() { return { x: zombie.x - 9, y: zombie.y - 38, w: 18, h: 38 }; }
  const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function setHeroState(s) { hero.state = s; hero.f = 0; hero.ft = 0; hero.t = 0; }

  function startStep(i) {
    const s = HERO_STEPS[i];
    hero.step = i;
    hero.st = s;
    hero.queued = false;
    hero.hitDone = false;
    setHeroState('attack');
    hero.vx = hero.face * s.lunge;
    sfx('swing');
  }

  function advance(obj, durs) {
    obj.ft++;
    if (obj.ft >= durs[obj.f]) { obj.ft = 0; obj.f++; return true; }
    return false;
  }

  function addPower(n) {
    const was = hero.power;
    hero.power = Math.min(100, hero.power + n);
    if (was < 100 && hero.power >= 100) { sfx('ready'); puff(hero.x, hero.y - 20, 14, 'rgba(239,232,255,0.95)', 1.6); }
  }

  function heroHitsZombie(dmg, push, { power = false, finisher = false } = {}) {
    if (zombie.state === 'dead') return false;
    const dir = Math.sign(zombie.x - hero.x) || hero.face;
    if (zombie.state === 'guard' && !power) {
      // o zumbi defendeu: sem dano, faísca cinza
      sfx('zguard');
      puff(zombie.x - dir * 8, zombie.y - 22, 6, 'rgba(200,190,230,0.9)', 1.2, 8);
      zombie.kx = dir * 1;
      addPower(2);
      return false;
    }
    const mult = zombie.state === 'stun' ? 1.6 : 1;
    zombie.hp -= dmg * mult;
    zombie.flash = 4; // flash bem fraco, só para sinalizar o acerto
    zombie.kx = dir * push * (zombie.state === 'attack' || zombie.state === 'combo' ? 0.4 : 1);
    sfx('hit');
    puff(zombie.x - dir * 4, zombie.y - 20, 6, 'rgba(239,232,255,0.85)', 1.6, 8);
    if (finisher) { game.hitstop = 4; game.shake = 6; }
    game.combo = game.comboT > 0 ? game.combo + 1 : 1;
    game.comboT = 90;
    game.best = Math.max(game.best, game.combo);
    addPower(power ? 0 : 7);
    // apanhar interrompe o zumbi só se ele não estiver no meio de um ataque
    if (zombie.hp <= 0) killZombie();
    else if (!['attack', 'combo', 'stun'].includes(zombie.state)) setZombieState('hurt');
    return true;
  }

  function stepHero() {
    const h = hero;
    if (h.inv > 0) h.inv--;
    if (h.parryT > 0) h.parryT--;
    if (h.blockShake > 0) h.blockShake--;
    h.guardT = pressed.guard ? 0 : h.guardT + 1;
    h.t++;

    const want = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const free = h.state === 'move';

    // entradas que mudam de estado
    if (h.state !== 'dead' && h.state !== 'hurt' && h.state !== 'power' && h.state !== 'powerEnd') {
      if (pressed.power && h.power >= 100 && h.onGround) {
        h.power = 0;
        setHeroState('power');
        // trava no zumbi que estiver à frente: os 3 cortes do avanço sempre acertam quem estava no caminho
        const ahead = (zombie.x - h.x) * h.face;
        h.target = zombie.state !== 'dead' && ahead > -10 && ahead < 120;
        h.inv = 999;
        game.flash = 10; game.flashColor = C.lilac;
        sfx('power');
      } else if (keys.guard && (free || h.state === 'attack' || h.state === 'guard')) {
        if (h.state !== 'guard') { setHeroState('guard'); h.vx = 0; }
      } else if (h.state === 'guard' && !keys.guard && h.parryT === 0) {
        setHeroState('move');
      } else if (pressed.attack) {
        if (h.state === 'move') startStep(0);
        else if (h.state === 'attack') h.queued = true;
      }
    }

    // física horizontal
    if (h.state === 'move') {
      const acc = h.onGround ? 0.45 : 0.3;
      if (want) { h.vx = Math.max(-2, Math.min(2, h.vx + want * acc)); h.face = want; }
      else if (h.onGround) h.vx = Math.abs(h.vx) < 0.45 ? 0 : h.vx - Math.sign(h.vx) * 0.45;
      if (pressed.jump && h.onGround) { h.vy = -6.2; h.onGround = false; h.airT = 0; sfx('jump'); puff(h.x, h.y, 5, 'rgba(216,207,245,0.7)'); }
    } else if (h.state === 'attack' || h.state === 'guard' || h.state === 'hurt') {
      h.vx *= 0.82;
    }

    // estados
    if (h.state === 'attack') {
      const s = h.st;
      const animFrame = s.frames[h.f];
      if (!h.hitDone && s.hit.includes(animFrame)) {
        const zb = zombieBox();
        const reach = { x: h.face > 0 ? h.x : h.x - s.reach, y: h.y - 34, w: s.reach, h: 30 };
        if (overlaps(reach, zb)) { h.hitDone = true; heroHitsZombie(s.dmg, s.push, { finisher: s.finisher }); }
      }
      if (advance(h, s.dur)) {
        if (h.f >= s.frames.length) {
          if (h.queued && h.step < HERO_STEPS.length - 1 && h.onGround) startStep(h.step + 1);
          else { setHeroState('move'); h.step = 0; }
        } else if (h.queued && h.f >= s.frames.length - 1 && h.step < HERO_STEPS.length - 1 && h.onGround && h.hitDone !== null) {
          // pode emendar o próximo golpe já no último quadro
          startStep(h.step + 1);
        }
      }
    } else if (h.state === 'guard') {
      if (h.f < 1 && advance(h, [3])) h.f = 1;
      if (h.parryT === 0 && h.f === 2) h.f = 1;
    } else if (h.state === 'hurt') {
      if (++h.hurtT > 18) setHeroState('move');
    } else if (h.state === 'power') {
      const dur = [6, 6, 7, 7, 8];
      if (h.f >= 1 && h.f <= 3) {
        h.vx = h.face * 5.2;
        if (h.ft === 0) {
          if (h.target) heroHitsZombie(13, 1.2, { power: true });
          puff(h.x - h.face * 10, h.y - 14, 8, 'rgba(183,156,255,0.9)', 1.4, 12, 0);
        }
      } else h.vx *= 0.7;
      if (advance(h, dur) && h.f >= 5) { setHeroState('powerEnd'); h.vx = 0; }
    } else if (h.state === 'powerEnd') {
      if (h.f === 1 && h.ft === 0) {
        sfx('boom'); game.shake = 10; game.flash = 8; game.flashColor = C.lilacHot;
        puff(h.x, h.y - 4, 26, 'rgba(183,156,255,0.95)', 2.6, 20);
        if (h.target || Math.abs(zombie.x - h.x) < 56) heroHitsZombie(14, 3, { power: true, finisher: true });
      }
      if (advance(h, [5, 6, 6, 6, 10]) && h.f >= 5) { setHeroState('move'); h.inv = 20; }
    }

    // gravidade
    h.vy = Math.min(7, h.vy + 0.36);
    h.y += h.vy;
    const wasGround = h.onGround;
    if (h.y >= GROUND) { h.y = GROUND; h.vy = 0; h.onGround = true; } else h.onGround = false;
    if (h.onGround && !wasGround) { h.landT = 10; puff(h.x, h.y, 5, 'rgba(216,207,245,0.7)'); }
    if (h.landT > 0) h.landT--;
    h.airT = h.onGround ? 0 : h.airT + 1;
    h.runT = h.onGround && Math.abs(h.vx) > 0.4 ? h.runT + 1 : 0;

    h.x += h.vx;
    // não atravessa o zumbi andando (pulando por cima, sim; o poder atravessa)
    if (zombie.state !== 'dead' && h.state !== 'power' && h.y > zombie.y - 34) {
      const d = h.x - zombie.x;
      if (Math.abs(d) < 22) h.x = zombie.x + (d >= 0 ? 22 : -22);
    }
    h.x = Math.max(8, Math.min(W - 8, h.x));
  }

  // O zumbi acerta o herói: parry, bloqueio ou dano
  function zombieHitsHero(hit) {
    const h = hero;
    if (h.inv > 0 || h.state === 'dead') return 'miss';
    const facing = Math.sign(zombie.x - h.x) === h.face || Math.abs(zombie.x - h.x) < 4;
    if (h.state === 'guard' && facing) {
      if (h.guardT <= PARRY_WINDOW) {
        // PARRY
        h.parryT = 14;
        h.f = 2;
        zombie.posture = Math.max(0, zombie.posture - hit.posture);
        zombie.postureCD = 0;
        zombie.barAlpha = 1;
        game.hitstop = 6;
        game.shake = 3;
        sfx('parry');
        addPower(12);
        const px = h.x + h.face * 12;
        puff(px, h.y - 20, 14, 'rgba(255,216,77,0.95)', 2.2, 12, 0.02);
        puff(px, h.y - 20, 6, 'rgba(255,246,194,1)', 1, 8, 0);
        if (zombie.posture <= 0) breakPosture();
        else if (hit.heavy) { zombie.kx = -h.face * 1.5; }
        return 'parry';
      }
      // bloqueio: pouco dano, empurra
      h.hp -= Math.ceil(hit.dmg * 0.2);
      h.vx = -h.face * 1.8;
      h.blockShake = 6;
      sfx('block');
      addPower(4);
      puff(h.x + h.face * 10, h.y - 20, 6, 'rgba(216,207,245,0.9)', 1.2, 8);
      if (h.hp <= 0) heroDies();
      return 'block';
    }
    h.hp -= hit.dmg;
    h.inv = 40;
    h.hurtT = 0;
    setHeroState('hurt');
    h.vx = -Math.sign(zombie.x - h.x || 1) * 2.6;
    h.vy = -2;
    h.onGround = false;
    game.shake = 6;
    game.combo = 0;
    sfx('hurt');
    puff(h.x, h.y - 20, 8, 'rgba(255,59,78,0.8)', 1.6, 10);
    if (h.hp <= 0) heroDies();
    return 'hit';
  }

  function heroDies() {
    hero.hp = 0;
    setHeroState('dead');
    hero.inv = 0;
    game.mode = 'over';
    game.overT = 0;
    sfx('die');
  }

  // =====================================================================
  // Zumbi
  // =====================================================================
  function setZombieState(s) { zombie.state = s; zombie.f = 0; zombie.ft = 0; zombie.t = 0; zombie.hitFrames = {}; }

  function breakPosture() {
    setZombieState('stun');
    zombie.posture = 0;
    game.hitstop = 10;
    game.flash = 6; game.flashColor = C.yellowHot;
    sfx('break');
    puff(zombie.x, zombie.y - 30, 16, 'rgba(255,216,77,0.95)', 2, 18);
  }

  function killZombie() {
    zombie.hp = 0;
    setZombieState('dead');
    game.kills++;
    game.hitstop = 8;
    game.shake = 8;
    sfx('die');
  }

  function startZombieAttack(kind) {
    zombie.atk = kind === 'combo' ? ZOMBIE_COMBO : ZOMBIE_SLOW;
    setZombieState(kind === 'combo' ? 'windup' : 'attack');
    zombie.tell = kind === 'combo' ? 2 : 1;
    sfx('growl');
  }

  function stepZombie() {
    const z = zombie;
    z.t++;
    if (z.flash > 0) z.flash--;
    z.x += z.kx;
    z.kx *= 0.8;
    z.x = Math.max(12, Math.min(W - 12, z.x));
    // postura volta devagar se ficar um tempo sem levar parry
    z.postureCD++;
    if (z.state !== 'stun' && z.postureCD > 150 && z.posture < POSTURE_MAX) z.posture = Math.min(POSTURE_MAX, z.posture + 0.25);
    if (z.posture >= POSTURE_MAX) z.barAlpha = Math.max(0, z.barAlpha - 0.03);

    const dx = hero.x - z.x;
    const dist = Math.abs(dx);

    switch (z.state) {
      case 'idle': case 'walk': case 'run': {
        if (hero.state === 'dead' || !game.ai) { z.state = 'idle'; z.face = Math.sign(dx) || z.face; break; }
        z.face = Math.sign(dx) || z.face;
        if (z.cooldown > 0) z.cooldown--;
        // às vezes se defende quando o herói ataca de perto
        if (hero.state === 'attack' && hero.t === 1 && dist < 50 && Math.random() < z.guardChance) { setZombieState('guard'); break; }
        if (z.cooldown === 0 && dist < 44) { startZombieAttack(Math.random() < z.comboChance ? 'combo' : 'slow'); break; }
        let want = 'idle', v = 0;
        if (dist > 130) { want = 'run'; v = 1.3; }
        else if (dist > 32) { want = 'walk'; v = z.speed; }
        if (z.state !== want) { z.state = want; z.f = 0; z.ft = 0; }
        z.x += z.face * v;
        const rate = want === 'run' ? 6 : want === 'walk' ? 9 : 12;
        if (++z.ft >= rate) { z.ft = 0; z.f++; }
        break;
      }
      case 'windup': {
        // agacha antes da sequência rápida
        if (z.t >= ZOMBIE_COMBO.windup) { setZombieState('combo'); }
        break;
      }
      case 'attack': case 'combo': {
        const a = z.atk;
        const hit = a.hits[a.frames[z.f]];
        if (hit && !z.hitFrames[z.f] && z.ft === 0) {
          z.hitFrames[z.f] = true;
          sfx('swing');
          const reach = { x: z.face > 0 ? z.x : z.x - hit.reach, y: z.y - 34, w: hit.reach, h: 32 };
          if (overlaps(reach, heroBox())) zombieHitsHero(hit);
          if (z.state === 'stun') break; // parry quebrou a postura
        }
        if (z.f < 1) z.x += z.face * 0.3;
        if (advance(z, a.dur) && z.f >= a.frames.length) {
          setZombieState('idle');
          z.cooldown = Math.max(30, 80 - game.wave * 6) + Math.floor(Math.random() * 40);
          z.tell = 0;
        }
        break;
      }
      case 'guard': {
        if (z.t > 30) { setZombieState('idle'); z.cooldown = Math.min(z.cooldown, 10); }
        break;
      }
      case 'hurt': {
        if (z.t > 12) { setZombieState('idle'); z.cooldown = Math.max(z.cooldown, 16); }
        break;
      }
      case 'stun': {
        if (z.t > 150) { setZombieState('idle'); z.posture = POSTURE_MAX; z.cooldown = 40; }
        break;
      }
      case 'dead': {
        z.deadT++;
        if (z.deadT === 110) nextWave();
        break;
      }
    }
    // não deixa o zumbi atravessar o herói
    if (z.state !== 'dead' && hero.y > z.y - 34 && hero.state !== 'power') {
      const d = z.x - hero.x;
      if (Math.abs(d) < 22) z.x = hero.x + (d >= 0 ? 22 : -22);
      z.x = Math.max(12, Math.min(W - 12, z.x));
    }
  }

  function nextWave() {
    game.wave++;
    game.banner = 120;
    hero.hp = Math.min(hero.maxHp, hero.hp + 30);
    zombie = newZombie(game.wave);
    zombie.x = hero.x < W / 2 ? W - 30 : 30;
    sfx('wave');
  }

  // =====================================================================
  // Passo
  // =====================================================================
  function step() {
    game.t++;
    particles = particles.filter((q) => { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; return q.life > 0; });
    if (game.shake > 0) game.shake--;
    if (game.flash > 0) game.flash--;
    if (game.banner > 0) game.banner--;
    if (game.comboT > 0 && --game.comboT === 0) game.combo = 0;

    if (game.mode === 'title') {
      if (pressed.jump || pressed.attack) startGame();
    } else if (game.mode === 'play') {
      if (game.hitstop > 0) { game.hitstop--; }
      else { stepHero(); if (game.mode === 'play') stepZombie(); }
    } else if (game.mode === 'over') {
      game.overT++;
      if (game.overT > 50 && (pressed.jump || pressed.attack)) startGame();
    }
    for (const k in pressed) pressed[k] = false;
  }

  // =====================================================================
  // Desenho
  // =====================================================================
  function heroFrame() {
    const h = hero;
    switch (h.state) {
      case 'attack': return [h.st.anim, h.st.frames[Math.min(h.f, h.st.frames.length - 1)]];
      case 'guard': return ['guard', h.f];
      case 'hurt': return ['fall', 1];
      case 'power': return ['power', Math.min(h.f, 4)];
      case 'powerEnd': return ['powerEnd', Math.min(h.f, 4)];
      case 'dead': return ['land', 2];
    }
    if (!h.onGround) return h.vy < 0 ? ['jump', h.airT < 5 ? 1 : h.vy < -2.5 ? 2 : 3] : h.vy < 2 ? ['jump', 4] : ['fall', Math.floor(h.airT / 6) % 4];
    if (h.landT > 0 && Math.abs(h.vx) < 0.5) return ['land', 2 + Math.min(2, Math.floor((10 - h.landT) / 4))];
    if (Math.abs(h.vx) > 0.4) return ['run', Math.floor(h.runT / 4) % 7];
    return ['idle', Math.floor(game.t / 11) % 4];
  }
  function zombieFrame() {
    const z = zombie;
    switch (z.state) {
      case 'walk': return ['walk', z.f % 6];
      case 'run': return ['run', z.f % 5];
      case 'windup': return ['attack', 0];
      case 'attack': case 'combo': return [z.atk.anim, z.atk.frames[Math.min(z.f, z.atk.frames.length - 1)]];
      case 'guard': return ['guard', Math.min(2, Math.floor(z.t / 4))];
      case 'hurt': return ['stun', 0];
      case 'stun': return ['stun', Math.floor(z.t / 12) % 3];
      case 'dead': return ['death', Math.min(3, Math.floor(z.deadT / 9))];
    }
    return ['idle', Math.floor(game.t / 12) % 4];
  }

  function drawBar(x, y, w, h, frac, color, back = C.hpBack) {
    ctx.fillStyle = C.ink; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = back; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color; ctx.fillRect(x, y, Math.round(w * Math.max(0, Math.min(1, frac))), h);
  }

  function render() {
    const t = game.t;
    ctx.save();
    if (game.shake) ctx.translate(Math.round((Math.random() * 2 - 1) * 2), Math.round((Math.random() * 2 - 1) * 2));
    ctx.drawImage(bg, 0, 0);

    if (game.mode !== 'title' && hero && zombie) {
      // sombras
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(Math.round(zombie.x - 10), GROUND - 1, 20, 2);
      ctx.fillRect(Math.round(hero.x - 8), GROUND - 1, 16, 2);

      // zumbi
      const z = zombie;
      const [za, zf] = zombieFrame();
      const zAlpha = z.state === 'dead' ? Math.max(0, 1 - Math.max(0, z.deadT - 50) / 50) : 1;
      drawSprite('zombie', za, zf, z.x, z.y, z.face, { alpha: zAlpha });
      if (z.flash > 0) drawSprite('zombie', za, zf, z.x, z.y, z.face, { tint: 'white', alpha: 0.16 * zAlpha }); // flash bem fraco
      // aviso antes do golpe: brilho vermelho no olho
      if ((z.state === 'attack' && z.f === 0 && z.ft > 8) || z.state === 'windup') {
        const gx = z.x + z.face * 4, gy = z.y - 31;
        const big = z.state === 'windup' ? 2 : 1;
        ctx.fillStyle = 'rgba(255,59,78,0.35)';
        ctx.fillRect(gx - 2 - big, gy - 2 - big, 5 + big * 2, 5 + big * 2);
        ctx.fillStyle = (t >> 2) % 2 ? '#ff3b4e' : '#ffb3bb';
        ctx.fillRect(gx - 1, gy - 1, 3, 3);
        if (z.state === 'windup') { ctx.fillRect(gx - 5, gy - 1, 1, 3); ctx.fillRect(gx + 5, gy - 1, 1, 3); }
      }
      // barra vermelha de postura (só depois do parry)
      if (z.barAlpha > 0 && z.state !== 'dead') {
        ctx.globalAlpha = z.barAlpha;
        const bw = 30, bx = Math.round(z.x - bw / 2), by = Math.round(z.y - 50);
        const frac = z.posture / POSTURE_MAX;
        drawBar(bx, by, bw, 3, frac, z.state === 'stun' ? ((t >> 3) % 2 ? C.yellow : C.red) : C.red, C.redDark);
        ctx.globalAlpha = 1;
      }

      // herói
      const h = hero;
      const [ha, hf] = heroFrame();
      const blink = h.inv > 0 && h.inv < 900 && h.state !== 'powerEnd' && (h.inv >> 2) % 2;
      const ox = h.blockShake ? (h.blockShake % 2 ? 1 : -1) : 0;
      if (!blink || h.state === 'dead') drawSprite('hero', ha, hf, h.x + ox, h.y, h.face, { alpha: h.state === 'dead' ? 0.8 : 1 });
      if (h.parryT > 0) {
        // flash amarelo na defesa: o corpo só esquenta, o arco da defesa acende forte
        const k = h.parryT / 14;
        drawSprite('hero', ha, hf, h.x, h.y, h.face, { tint: 'yellow', alpha: 0.3 * k });
        const cx = h.x + h.face * 6, cy = h.y - 20;
        ctx.save();
        ctx.globalAlpha = k;
        ctx.lineWidth = 3;
        ctx.strokeStyle = C.yellow;
        ctx.beginPath();
        ctx.arc(cx, cy, 15 - k * 3, h.face > 0 ? -1.1 : Math.PI - 1.1, h.face > 0 ? 1.1 : Math.PI + 1.1);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.strokeStyle = C.yellowHot;
        ctx.beginPath();
        ctx.arc(cx, cy, 15 - k * 3, h.face > 0 ? -0.9 : Math.PI - 0.9, h.face > 0 ? 0.9 : Math.PI + 0.9);
        ctx.stroke();
        // estrela do impacto
        const sx = Math.round(cx + h.face * (16 - k * 3)), sy = Math.round(cy);
        const r = Math.round(2 + k * 5);
        ctx.fillStyle = C.yellowHot;
        ctx.fillRect(sx - r, sy, r * 2 + 1, 1);
        ctx.fillRect(sx, sy - r, 1, r * 2 + 1);
        ctx.restore();
      }
    }

    for (const q of particles) { ctx.fillStyle = q.color; ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 1); }
    ctx.restore();

    if (game.flash > 0) {
      ctx.globalAlpha = game.flash / 30;
      ctx.fillStyle = game.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    if (game.mode === 'title') return drawTitle(t);

    // HUD
    const h = hero;
    drawText('VIDA', 8, 8, { color: C.dim });
    drawBar(30, 8, 80, 5, h.hp / h.maxHp, h.hp < 30 ? C.red : C.hp);
    drawText('PODER', 8, 18, { color: C.dim });
    const full = h.power >= 100;
    drawBar(30, 18, 80, 4, h.power / 100, full ? ((t >> 3) % 2 ? C.lilacHot : C.lilac) : C.power);
    if (full) drawText('L - PODER PRONTO', 116, 17, { color: (t >> 3) % 2 ? C.lilacHot : C.accent });
    drawText(`ONDA ${game.wave}`, W - 8, 8, { align: 'right' });
    if (game.combo >= 2) drawText(`${game.combo} ACERTOS`, W - 8, 18, { align: 'right', color: C.accent });
    if (game.banner > 0) {
      ctx.globalAlpha = Math.min(1, game.banner / 30);
      drawText(`ONDA ${game.wave}`, W / 2, 50, { s: 4, align: 'center' });
      if (game.wave === 1) {
        drawText('APERTE A DEFESA NA HORA DO GOLPE PARA DAR PARRY', W / 2, 76, { align: 'center', color: C.yellow });
        drawText('O PODER CARREGA ATACANDO E DEFENDENDO', W / 2, 86, { align: 'center', color: C.dim });
      }
      ctx.globalAlpha = 1;
    }
    if (zombie.state === 'stun') drawText('ATORDOADO!', zombie.x, zombie.y - 60, { align: 'center', color: (t >> 3) % 2 ? C.yellow : C.yellowHot });

    if (game.mode === 'over') {
      ctx.fillStyle = `rgba(11,9,20,${Math.min(0.8, game.overT / 60)})`;
      ctx.fillRect(0, 0, W, H);
      if (game.overT > 30) {
        drawText('VOCÊ CAIU', W / 2, 60, { s: 4, align: 'center', color: C.red });
        drawText(`CHEGOU ATÉ A ONDA ${game.wave}  -  ${game.kills} ZUMBIS`, W / 2, 92, { align: 'center' });
        drawText(`MAIOR SEQUÊNCIA: ${game.best} ACERTOS`, W / 2, 104, { align: 'center', color: C.dim });
        if (game.overT > 50 && (t >> 5) % 2 === 0) drawText('ESPAÇO OU TOQUE PARA LUTAR DE NOVO', W / 2, 136, { s: 1, align: 'center', color: C.accent });
      }
    }
  }

  function drawTitle(t) {
    ctx.fillStyle = 'rgba(11,9,20,0.55)';
    ctx.fillRect(0, 0, W, H);
    drawText('MEIA-NOITE', W / 2, 28, { s: 5, align: 'center' });
    drawText('UM DUELO CONTRA OS MORTOS', W / 2, 58, { align: 'center', color: C.accent });
    drawSprite('hero', 'idle', Math.floor(t / 11) % 4, W / 2 - 50, 150, 1, { scale: 1.6 });
    drawSprite('zombie', 'idle', Math.floor(t / 12) % 4, W / 2 + 54, 150, -1, { scale: 1.6 });
    if ((t >> 5) % 2 === 0) drawText('APERTE ESPAÇO OU TOQUE PARA LUTAR', W / 2, 162, { align: 'center' });
    drawText('SETAS ANDAM  -  ESPAÇO PULA  -  J ATACA  -  K DEFENDE  -  L PODER', W / 2, 182, { align: 'center', color: C.dim });
    drawText('ATAQUE VÁRIAS VEZES PARA FAZER COMBO  -  DEFENDA NA HORA CERTA PARA DAR PARRY', W / 2, 194, { align: 'center', color: C.dim });
  }

  // =====================================================================
  // Entrada
  // =====================================================================
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
    KeyJ: 'attack', KeyX: 'attack', KeyZ: 'attack',
    KeyK: 'guard', KeyC: 'guard', ShiftLeft: 'guard',
    KeyL: 'power', KeyV: 'power',
  };
  function setKey(k, down) {
    if (down && !keys[k] && k in pressed) pressed[k] = true;
    keys[k] = down;
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyM') { muted = !muted; return; }
    if (e.code === 'Escape' && game.mode !== 'title') { e.preventDefault(); goMenu(); return; }
    const k = KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (!e.repeat) setKey(k, true);
  });
  window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) setKey(k, false); });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.querySelectorAll('.pad button').forEach((b) => {
    const k = b.dataset.key;
    const on = (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch {} b.classList.add('on'); setKey(k, true); };
    const off = (e) => { e.preventDefault(); b.classList.remove('on'); setKey(k, false); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  });
  canvas.addEventListener('pointerdown', () => { if (game.mode === 'title' || (game.mode === 'over' && game.overT > 50)) pressed.attack = true; });
  const backBtn = document.getElementById('back-btn');
  function goMenu() {
    for (const k in keys) keys[k] = false;
    document.querySelectorAll('.pad button.on').forEach((b) => b.classList.remove('on'));
    game.mode = 'title';
  }
  backBtn.addEventListener('click', goMenu);

  // =====================================================================
  // Laço com passo fixo
  // =====================================================================
  let last = performance.now();
  let acc = 0;
  let paused = false;
  function frame(now) {
    requestAnimationFrame(frame);
    const showBack = game.mode !== 'title';
    if (backBtn.hidden === showBack) backBtn.hidden = !showBack;
    if (paused) { last = now; return; }
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= DT) { step(); acc -= DT; }
    render();
  }
  requestAnimationFrame(frame);

  // Gancho para testes automatizados
  // quadros até o próximo golpe do zumbi sair (para os testes e para depurar)
  function ticksToNextHit() {
    const z = zombie;
    if (!z) return null;
    if (z.state === 'windup') return ZOMBIE_COMBO.windup - z.t;
    if (z.state !== 'attack' && z.state !== 'combo') return null;
    const a = z.atk;
    let n = 0;
    for (let f = z.f; f < a.frames.length; f++) {
      if (a.hits[a.frames[f]] && !z.hitFrames[f] && !(f === z.f && z.ft > 0)) return n + (f === z.f ? 0 : 0);
      n += a.dur[f] - (f === z.f ? z.ft : 0);
    }
    return null;
  }

  window.duelo = {
    pause() { paused = true; },
    resume() { paused = false; },
    start() { startGame(); },
    key(k, down) { setKey(k, down); },
    tap(k) { setKey(k, true); step(); setKey(k, false); },
    step(n = 1) { for (let i = 0; i < n; i++) step(); render(); },
    ai(on) { game.ai = on; },
    zombieAttack(kind) { startZombieAttack(kind); },
    place(hx, zx) { hero.x = hx; zombie.x = zx; hero.face = Math.sign(zx - hx) || 1; zombie.face = -hero.face; },
    set(obj) { Object.assign(hero, obj.hero || {}); Object.assign(zombie, obj.zombie || {}); },
    sounds() { return soundLog.slice(); },
    clearSounds() { soundLog.length = 0; },
    state() {
      return {
        mode: game.mode, wave: game.wave, kills: game.kills, hitstop: game.hitstop, combo: game.combo,
        hero: { x: hero?.x, y: hero?.y, hp: hero?.hp, power: hero?.power, state: hero?.state, step: hero?.step, f: hero?.f, parryT: hero?.parryT, face: hero?.face, anim: hero && heroFrame()[0] },
        zombie: zombie && { nextHit: ticksToNextHit(), x: zombie.x, hp: zombie.hp, posture: zombie.posture, barAlpha: zombie.barAlpha, state: zombie.state, f: zombie.f, flash: zombie.flash, anim: zombieFrame()[0] },
        ready: Object.values(sheets).every((s) => s.ready),
      };
    },
  };
}
</script>
