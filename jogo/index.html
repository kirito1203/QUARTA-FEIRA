<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0918">
<title>Lá em Cima</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0918;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: grid;
    place-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  .pad {
    position: fixed;
    bottom: max(18px, env(safe-area-inset-bottom));
    display: none;
    gap: 14px;
    align-items: flex-end;
  }
  .pad.left { left: max(18px, env(safe-area-inset-left)); }
  .pad.right { right: max(18px, env(safe-area-inset-right)); }
  @media (pointer: coarse) { .pad { display: flex; } }
  .pad button {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 2px solid rgba(214, 200, 255, 0.3);
    background: rgba(14, 11, 30, 0.55);
    color: #efe8ff;
    font: 700 13px/1 ui-monospace, Menlo, Consolas, monospace;
    touch-action: none;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .pad button svg { width: 26px; height: 26px; fill: #efe8ff; display: block; margin: auto; }
  .pad button.on { background: rgba(183, 156, 255, 0.35); border-color: #c9b6ff; }
  .pad .jump { width: 84px; height: 84px; }
  .pad .fire { margin-bottom: 40px; }
</style>
</head>

  function drawSprite(name, anim, frame, x, y, face = 1, scale = 1, white = false) {

    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
    Y: '101101010010010', Z: '111001010100111',

  };
  const ACCENTS = {
    'Á': ['A', [[2, -2], [1, -1]]], 'À': ['A', [[0, -2], [1, -1]]], 'Â': ['A', [[0, -1], [1, -2], [2, -1]]],
    'Ã': ['A', [[0, -1], [1, -2], [2, -2]]], 'É': ['E', [[2, -2], [1, -1]]], 'Ê': ['E', [[0, -1], [1, -2], [2, -1]]],

    'Õ': ['O', [[0, -1], [1, -2], [2, -2]]], 'Ú': ['U', [[2, -2], [1, -1]]], 'Ç': ['C', [[1, 5], [0, 6]]],
  };
  const textWidth = (str, s = 1) => str.length * 4 * s - s;
  function drawText(str, x, y, { s = 1, color = C.text, align = 'left', shadow = C.ink } = {}) {
    str = str.toUpperCase();
    if (align === 'center') x -= Math.floor(textWidth(str, s) / 2);
    if (align === 'right') x -= textWidth(str, s);
    x = Math.round(x); y = Math.round(y);
    const pass = (ox, oy, col) => {
      ctx.fillStyle = col;
      for (let i = 0; i < str.length; i++) {
        let ch = str[i];
        let marks = null;
        if (ACCENTS[ch]) [ch, marks] = ACCENTS[ch];
        const g = GLYPHS[ch] || GLYPHS['?'];
        const cx = x + i * 4 * s + ox;
        for (let p = 0; p < 15; p++) {
          if (g[p] === '1') ctx.fillRect(cx + (p % 3) * s, y + Math.floor(p / 3) * s + oy, s, s);
        }
        if (marks) for (const [mx, my] of marks) ctx.fillRect(cx + mx * s, y + my * s + oy, s, s);
      }
    };
    if (shadow) pass(s, s, shadow);
    pass(0, 0, color);
  }

  let audio = null;

  function sfx(kind) {

      if (audio.state === 'suspended') audio.resume();
      const t = audio.currentTime;
      const tone = (type, f0, f1, dur, vol, delay = 0) => {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, t + delay);
        o.frequency.exponentialRampToValueAtTime(f1, t + delay + dur);
        g.gain.setValueAtTime(vol, t + delay);
        g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
        o.connect(g).connect(audio.destination);
        o.start(t + delay);
        o.stop(t + delay + dur + 0.02);
      };
      const S = {
        jump: () => tone('square', 240, 560, 0.12, 0.05),
        land: () => tone('triangle', 130, 65, 0.07, 0.08),
        door: () => [330, 415, 494, 659].forEach((f, i) => tone('triangle', f, f, 0.18, 0.07, i * 0.08)),
        fall: () => tone('sawtooth', 380, 55, 0.45, 0.05),

        kill: () => [660, 880, 1320].forEach((f, i) => tone('triangle', f, f * 0.7, 0.1, 0.05, i * 0.05)),
        hurt: () => tone('sawtooth', 300, 80, 0.35, 0.07),
        empty: () => tone('square', 120, 110, 0.05, 0.05),
        pickup: () => [784, 1046].forEach((f, i) => tone('triangle', f, f, 0.1, 0.06, i * 0.07)),
        plate: () => tone('triangle', 200, 260, 0.08, 0.06),
        gate: () => tone('sawtooth', 90, 140, 0.3, 0.03),
        push: () => tone('triangle', 70, 60, 0.05, 0.03),

    for (let y = s.y + 5; y < s.y + s.h; y += 8) {

  function drawPlatform(p, t) {
    if (p.power === 'appear') return drawLightPlatform(p, t);
    let x = Math.round(p.x), y = Math.round(p.y);
    if (p.crumble) {
      if (p.gone) return;
      if (p.t > 8 && !p.drop) x += (t % 4 < 2 ? 1 : -1);
      y += Math.round(p.drop || 0);
      ctx.globalAlpha = p.drop ? Math.max(0, 1 - p.drop / 40) : 1;
    }
    const h = 10;
    ctx.fillStyle = C.ink;
    ctx.fillRect(x - 1, y - 1, p.w + 2, h + 2);
    ctx.fillStyle = p.elevator ? C.metalDark : C.stoneDark;
    ctx.fillRect(x, y, p.w, h);
    ctx.fillStyle = p.elevator ? C.metal : C.stone;
    for (let bx = x + 1; bx < x + p.w - 1; bx += 10) ctx.fillRect(bx, y + 5, Math.min(9, x + p.w - 1 - bx), 4);
    ctx.fillStyle = C.stoneLight;
    ctx.fillRect(x, y + 4, p.w, 1);
    ctx.fillStyle = p.elevator ? C.metal : C.frostDark;
    ctx.fillRect(x, y, p.w, 3);
    ctx.fillStyle = p.elevator ? '#8f87c2' : C.frost;
    ctx.fillRect(x, y, p.w, 1);
    if (p.crumble) {
      ctx.fillStyle = C.ink;
      const k = Math.min(3, Math.floor((p.t || 0) / 8));
      for (let i = 0; i <= k; i++) ctx.fillRect(x + 8 + i * 11, y + 3, 1, 4 + (i % 2) * 2);

    if (p.move && p.move.axis === 'x') {
      ctx.fillStyle = C.lilac;
      ctx.fillRect(x + p.w / 2 - 3, y + h, 6, 2);

  function drawLightPlatform(p, t) {

      ctx.fillStyle = C.metalDark;
      ctx.fillRect(r.x, y, r.w, 2);
      ctx.fillStyle = col.dim;
      ctx.fillRect(r.x + 3, y, 2, 2);
    }
    // pontas
    ctx.fillStyle = '#8f87c2';
    for (let i = 0; i < 3; i++) ctx.fillRect(r.x + i * 3, r.y + r.h - 2, 2, 2);
  }

  function drawBox(b) {
    const x = Math.round(b.x), y = Math.round(b.y);
    ctx.fillStyle = C.ink;
    ctx.fillRect(x - 1, y - 1, BOX + 2, BOX + 2);
    ctx.fillStyle = C.wood;
    ctx.fillRect(x, y, BOX, BOX);
    ctx.fillStyle = C.woodLight;
    ctx.fillRect(x, y, BOX, 2);
    ctx.fillRect(x, y, 2, BOX);
    ctx.fillStyle = C.woodDark;
    ctx.fillRect(x + BOX - 2, y, 2, BOX);
    ctx.fillRect(x, y + BOX - 2, BOX, 2);
    // X de reforço
    ctx.fillStyle = C.woodDark;
    for (let i = 3; i < BOX - 3; i++) {
      ctx.fillRect(x + i, y + i, 2, 1);
      ctx.fillRect(x + BOX - 1 - i - 1, y + i, 2, 1);
    }
    ctx.fillStyle = C.accent;
    ctx.fillRect(x + 3, y + 3, 1, 1);
    ctx.fillRect(x + BOX - 4, y + 3, 1, 1);
    ctx.fillRect(x + 3, y + BOX - 4, 1, 1);
    ctx.fillRect(x + BOX - 4, y + BOX - 4, 1, 1);
  }

  // Porta: x = canto esquerdo, y = chão. open: 0..1
  function drawDoor(d, open, t) {
    const x = d.x, y = d.y, w = 24, h = 36;
    if (open > 0) {
      ctx.fillStyle = `rgba(201,182,255,${0.22 * open})`;
      ctx.fillRect(x - 10, y - 3, w + 20, 3);
      ctx.fillStyle = `rgba(201,182,255,${0.08 * open})`;
      ctx.fillRect(x - 6, y - h - 6, w + 12, h + 6);
    }
    ctx.fillStyle = C.ink;
    ctx.fillRect(x - 3, y - h - 1, w + 6, h + 1);
    ctx.fillRect(x - 1, y - h - 4, w + 2, 3);
    ctx.fillStyle = C.stoneLight;
    ctx.fillRect(x - 2, y - h, w + 4, h);
    ctx.fillRect(x, y - h - 3, w, 3);
    ctx.fillStyle = C.frostDark;
    ctx.fillRect(x - 2, y - h, w + 4, 1);
    const ix = x + 1, iy = y - h + 1, iw = w - 2, ih = h - 1;
    ctx.fillStyle = C.ink;
    ctx.fillRect(ix, iy, iw, ih);
    if (open > 0) {
      ctx.fillStyle = C.lilac;
      ctx.fillRect(ix + 1, iy + 1, iw - 2, ih - 1);
      ctx.globalAlpha = 0.8 + Math.sin(t * 0.1) * 0.2;
      ctx.fillStyle = C.lilacHot;
      ctx.fillRect(ix + 4, iy + 4, iw - 8, ih - 4);
      ctx.globalAlpha = 1;
    }
    const pw = Math.max(0, Math.round(iw * (1 - open)));
    if (pw > 0) {
      ctx.fillStyle = C.wood;
      ctx.fillRect(ix, iy, pw, ih);
      ctx.fillStyle = C.woodDark;
      for (let px = ix + 4; px < ix + pw; px += 5) ctx.fillRect(px, iy, 1, ih);
      ctx.fillRect(ix, iy + 7, pw, 1);
      ctx.fillRect(ix, iy + ih - 8, pw, 1);
      if (pw > 7) {
        ctx.fillStyle = C.accent;
        ctx.fillRect(ix + pw - 4, iy + 17, 2, 3);
      }
    }
    ctx.fillStyle = open > 0 ? C.lilacHot : C.lilac;
    ctx.fillRect(x + w / 2 - 1, y - h - 4, 2, 2);
  }

  // Chama em pixel (ícone de munição e chama para pegar)
  function drawFlame(x, y, t, dim = false) {
    x = Math.round(x); y = Math.round(y);
    const flick = Math.floor(t / 5) % 2;
    ctx.fillStyle = C.ink;
    ctx.fillRect(x - 3, y - 6, 7, 9);
    ctx.fillStyle = dim ? C.stoneLight : C.lilacDim;
    ctx.fillRect(x - 2, y - 3, 5, 5);
    ctx.fillRect(x - 1, y - 5 + flick, 3, 2);
    ctx.fillStyle = dim ? C.stone : C.lilac;
    ctx.fillRect(x - 1, y - 2, 3, 3);
    ctx.fillRect(x, y - 4 + flick, 1, 2);
    if (!dim) {
      ctx.fillStyle = C.lilacHot;
      ctx.fillRect(x, y - 1, 1, 2);
    }
  }

  function drawGhostEnemy(g, t) {
    let a = 1, s = 1;
    if (g.dead) {
      if (g.deathT > 8) { a = Math.max(0, 1 - (g.deathT - 8) / 16); s = 1 + (g.deathT - 8) / 24; }
    }
    // halo para aparecer contra o céu escuro
    ctx.globalAlpha = 0.16 * a;
    ctx.fillStyle = C.lilac;
    ctx.beginPath(); ctx.arc(g.x, g.y + 6, 19, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.12 * a;
    ctx.beginPath(); ctx.arc(g.x, g.y + 6, 13, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = a;
    const frame = Math.floor((t + g.phase * 10) / 7) % 8;
    const white = g.flash > 0 && (g.flash % 4 < 3);
    drawSprite('ghost', 'float', frame, g.x, g.y, g.face, s, white || (g.dead && g.deathT < 8));
    ctx.globalAlpha = 1;
  }

  function drawShot(sh, t) {
    const x = Math.round(sh.x), y = Math.round(sh.y);
    ctx.fillStyle = 'rgba(183,156,255,0.35)';
    ctx.fillRect(x - 5, y - 4, 10, 8);
    ctx.fillStyle = C.lilac;
    ctx.fillRect(x - 3, y - 2, 6, 4);
    ctx.fillRect(x - 2, y - 3, 4, 6);
    ctx.fillStyle = C.lilacHot;
    ctx.fillRect(x - 1 + Math.sign(sh.vx), y - 1, 2, 2);
  }

  // =====================================================================
  // Personagem
  // =====================================================================
  function playerFrame(p, t) {
    if (game.mode === 'dead') return ['fall', Math.floor(t / 4) % 4];
    if (!p.onGround) {
      if (p.vy < 0) {
        if (p.airT < 5) return ['jump', 1];
        if (p.vy < -2.5) return ['jump', 2];
        return ['jump', 3];
      }
      if (p.vy < 2) return ['jump', 4];
      return ['fall', Math.floor(p.airT / 6) % 4];
    }
    if (p.landT > 0 && !(Math.abs(p.vx) > 0.5 && p.landT < 8)) return ['land', 2 + Math.min(2, Math.floor((12 - p.landT) / 4))];
    if (Math.abs(p.vx) > 0.4) return ['run', Math.floor(p.runT / (p.pushing ? 7 : 4)) % 7];
    return ['idle', Math.floor(t / 11) % 4];
  }
  function drawPlayer(p, t) {
    if (p.hidden) return;
    const [anim, frame] = playerFrame(p, t);
    ctx.globalAlpha = p.fade == null ? 1 : p.fade;
    const white = game.mode === 'dead' && game.deadT % 6 < 3;
    drawSprite('player', anim, frame, p.x + PW / 2, p.y + PH, p.face, 1, white);
    ctx.globalAlpha = 1;
  }

  // =====================================================================
  // Partículas
  // =====================================================================
  let particles = [];
  function puff(x, y, n, color = 'rgba(216,207,245,0.8)', spread = 1.4, life = 16) {
    for (let i = 0; i < n; i++) {
      particles.push({ x, y, vx: (Math.random() * 2 - 1) * spread, vy: -Math.random() * spread * 0.7, life: life + Math.random() * 12, color, g: 0.04 });
    }
  }

  // =====================================================================
  // Estado
  // =====================================================================
  const keys = { left: false, right: false, jump: false, fire: false };
  let jumpPressed = false;
  let firePressed = false;

  const game = {
    mode: 'title', // title | play | enter | dead | iris-out | iris-in | end
    level: 0, t: 0, deaths: 0, frames: 0,
    doorOpen: 0, iris: 1, banner: 0, shake: 0, power: {},
    ammo: 0, cool: 0, ammoShake: 0, deadT: 0, noEnemies: false,
  };
  let L = null;
  const player = { x: 0, y: 0, w: PW, h: PH, vx: 0, vy: 0, face: 1, onGround: false, standOn: null, coyote: 0, buffer: 0, runT: 0, airT: 0, landT: 0, hidden: false, enterT: 0, fade: null, pushing: false };

  function loadLevel(i, retry = false) {
    game.level = i;
    const src = LEVELS[i];
    L = {
      ...src,
      solids: src.solids.map((s) => ({ ...s })),
      platforms: src.platforms.map((p) => ({ ...p, ch: p.ch || 'a', dir: -1, wait: 0, prevX: p.x, prevY: p.y, t: 0, drop: 0, gone: false, respawn: 0, appear: 0, delay: null })),
      levers: (src.levers || []).map((l) => ({ ...l, ch: l.ch || 'a', on: false, anim: 0 })),
      plates: (src.plates || []).map((p) => ({ ...p, ch: p.ch || 'a', down: false })),
      gates: (src.gates || []).map((g) => ({ ...g, ch: g.ch || 'a', open: 0 })),
      boxes: (src.boxes || []).map((b) => ({ x: b.x, y: b.y - BOX, w: BOX, h: BOX, vy: 0, home: { x: b.x, y: b.y - BOX }, standOn: null })),
      ghosts: (src.ghosts || []).map((g, k) => ({ ...g, hx: g.x, hy: g.y, ox: 0, dir: 1, face: 1, hp: g.hp || 1, flash: 0, kx: 0, dead: false, deathT: 0, phase: k * 1.7 })),
      flames: (src.flames || []).map((f) => ({ ...f, taken: false })),
      wires: src.wires || [],
      shots: [],
    };
    let k = 0;
    for (const pl of L.platforms) if (pl.power === 'appear') pl.order = k++;
    game.power = {};
    game.doorOpen = 0;
    game.ammo = src.ammo || 0;
    game.cool = 0;
    game.banner = retry ? 0 : 170;
    particles = [];
    Object.assign(player, { x: L.start.x, y: L.start.y - PH, vx: 0, vy: 0, face: 1, onGround: true, standOn: null, coyote: 0, buffer: 0, airT: 0, landT: 0, hidden: false, enterT: 0, fade: null, pushing: false });
  }

  const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const solidPlatform = (pl) => !(pl.crumble && (pl.gone || pl.drop > 0)) && !(pl.power === 'appear' && pl.appear < 0.6);
  const pbox = () => ({ x: player.x, y: player.y, w: PW, h: PH });
  const ghostBox = (g) => ({ x: g.x - 9, y: g.y - 8, w: 18, h: 24 });
  // sólidos de verdade: chão, paredes e portões fechados
  function walls() {
    const out = L.solids.slice();
    for (const g of L.gates) { const r = gateRect(g); if (r.h > 0) out.push(r); }
    return out;
  }

  // =====================================================================
  // Mundo: energia, plataformas, portões, caixas, fantasmas, tiros
  // =====================================================================
  function stepPower() {
    const pw = {};
    for (const lv of L.levers) if (lv.on) pw[lv.ch] = true;
    const bodies = [...L.boxes];
    if (game.mode === 'play') bodies.push(pbox());
    for (const pl of L.plates) {
      const was = pl.down;
      pl.down = bodies.some((b) => b.x + b.w > pl.x + 2 && b.x < pl.x + 22 && Math.abs(b.y + b.h - pl.y) < 2);
      if (pl.down && !was) sfx('plate');
      if (pl.down) pw[pl.ch] = true;
    }
    game.power = pw;
  }

  function stepPlatforms() {
    for (const pl of L.platforms) {
      pl.prevX = pl.x;
      pl.prevY = pl.y;
      if (pl.move && (pl.power !== 'move' || game.power[pl.ch])) {
        const m = pl.move;
        const key = m.axis;
        if (pl.wait > 0) pl.wait--;
        else {
          pl[key] += pl.dir * m.speed;
          if (pl[key] >= m.to) { pl[key] = m.to; pl.dir = -1; pl.wait = m.pause || 0; }
          if (pl[key] <= m.from) { pl[key] = m.from; pl.dir = 1; pl.wait = m.pause || 0; }
        }
      }
      if (pl.crumble) {
        if (pl.gone) {
          if (--pl.respawn <= 0) Object.assign(pl, { gone: false, t: 0, drop: 0 });
        } else if (pl.drop > 0) {
          pl.drop += 1 + pl.drop * 0.08;
          if (pl.drop > 60) Object.assign(pl, { gone: true, respawn: 150, drop: 0 });
        } else if (pl.t > 0) {
          pl.t++;
          if (pl.t > 30) {
            pl.drop = 1;
            sfx('crack');
            puff(pl.x + pl.w / 2, pl.y + 8, 8, 'rgba(141,132,196,0.9)', 2);
          }
        }
      }
      if (pl.power === 'appear' && game.power[pl.ch] && pl.appear < 1) {
        if (pl.delay == null) pl.delay = pl.order * 14;
        if (pl.delay > 0) pl.delay--;
        else {
          if (pl.appear === 0) { sfx('appear'); puff(pl.x + pl.w / 2, pl.y, 10, 'rgba(239,232,255,0.9)', 1.6); }
          pl.appear = Math.min(1, pl.appear + 1 / 18);
        }
      }
    }
  }

  function stepGates() {
    for (const g of L.gates) {
      const want = game.power[g.ch] ? 1 : 0;
      if (g.open < want) {
        if (g.open === 0) sfx('gate');
        g.open = Math.min(1, g.open + 1 / 18);
      } else if (g.open > want) {
        const next = Math.max(0, g.open - 1 / 18);
        const r = gateRect({ ...g, open: next });
        const blocked = overlaps(r, pbox()) || L.boxes.some((b) => overlaps(r, b));
        if (!blocked) g.open = next;
      }
    }
  }

  // move a caixa na horizontal até onde der; devolve quanto andou
  function pushBox(b, dx) {
    const x0 = b.x;
    b.x = Math.max(0, Math.min(W - BOX, b.x + dx));
    for (const s of [...walls(), ...L.boxes.filter((o) => o !== b)]) {
      if (overlaps(b, s)) b.x = dx > 0 ? s.x - BOX : s.x + s.w;
    }
    if (dx > 0) b.x = Math.max(x0, b.x); else b.x = Math.min(x0, b.x);
    return b.x - x0;
  }

  function stepBoxes() {
    for (const b of L.boxes) {
      if (b.standOn) { b.x += b.standOn.x - b.standOn.prevX; b.y += b.standOn.y - b.standOn.prevY; }
      const prevBottom = b.y + BOX;
      b.vy = Math.min(PHYS.maxFall, b.vy + PHYS.grav);
      b.y += b.vy;
      const landed = b.onGround;
      b.onGround = false;
      b.standOn = null;
      for (const s of [...walls(), ...L.boxes.filter((o) => o !== b)]) {
        if (!overlaps(b, s)) continue;
        if (b.vy >= 0 && prevBottom <= s.y + 0.5) { b.y = s.y - BOX; b.vy = 0; b.onGround = true; }
        else if (b.vy < 0) { b.y = s.y + s.h; b.vy = 0; }
      }
      for (const pl of L.platforms) {
        if (!solidPlatform(pl)) continue;
        const within = b.x + BOX > pl.x + 1 && b.x < pl.x + pl.w - 1;
        if (within && b.vy >= 0 && prevBottom <= pl.y + 0.5 && b.y + BOX >= pl.y) {
          b.y = pl.y - BOX; b.vy = 0; b.onGround = true; b.standOn = pl;
        }
      }
      if (b.onGround && !landed && prevBottom > 0) { sfx('land'); puff(b.x + BOX / 2, b.y + BOX, 6); }
      if (b.y > H + 40) { b.x = b.home.x; b.y = b.home.y; b.vy = 0; puff(b.x + BOX / 2, b.y + BOX / 2, 12, 'rgba(239,232,255,0.9)', 1.5); }
    }
  }

  function hitGhost(g, dir, stomp = false) {
    if (g.dead) return;
    g.hp = stomp ? 0 : g.hp - 1;
    g.flash = 10;
    g.kx = dir * 2.2; // empurrão bem de leve
    if (g.hp <= 0) {
      g.dead = true;
      g.deathT = 0;
      sfx('kill');
    } else {
      sfx('hit');
    }
    puff(g.x, g.y + 4, 8, 'rgba(239,232,255,0.95)', 1.8, 10);
  }

  function stepGhosts() {
    for (const g of L.ghosts) {
      if (g.dead) {
        g.deathT++;
        g.ox += g.kx; g.kx *= 0.82;
        g.x = g.hx + g.ox;
        if (g.deathT === 9) puff(g.x, g.y + 4, 18, 'rgba(183,156,255,0.9)', 2.2, 22);
        continue;
      }
      if (g.flash > 0) g.flash--;
      g.hx += g.dir * g.speed;
      if (g.hx > g.to) { g.hx = g.to; g.dir = -1; }
      if (g.hx < g.from) { g.hx = g.from; g.dir = 1; }
      // empurrão separado da patrulha: vai longe um pouco e volta devagar
      g.ox += g.kx;
      g.kx *= 0.82;
      g.ox *= 0.97;
      g.face = g.dir;
      g.x = g.hx + g.ox;
      g.y = g.hy + Math.sin(game.t * 0.06 + g.phase) * 4;
    }
    L.ghosts = L.ghosts.filter((g) => !(g.dead && g.deathT > 26));
  }

  function stepShots() {
    if (game.cool > 0) game.cool--;
    if (game.ammoShake > 0) game.ammoShake--;
    if (firePressed && game.mode === 'play' && game.cool === 0) {
      if (game.ammo > 0) {
        game.ammo--;
        game.cool = SHOT.cool;
        const f = player.face;
        L.shots.push({ x: player.x + PW / 2 + f * 8, y: player.y + 11, vx: f * SHOT.speed, life: SHOT.life, t: 0 });
        player.vx -= f * 0.6; // pequeno coice
        sfx('shoot');
      } else {
        game.ammoShake = 12;
        game.cool = 10;
        sfx('empty');
      }
    }
    firePressed = false;
    const blocks = [...walls(), ...L.boxes];
    L.shots = L.shots.filter((s) => {
      s.t++;
      s.life--;
      s.x += s.vx;
      s.y += Math.sin(s.t * 0.5) * 0.4;
      if (s.t % 2 === 0) particles.push({ x: s.x - Math.sign(s.vx) * 4, y: s.y + (Math.random() * 4 - 2), vx: -s.vx * 0.05, vy: -0.1, life: 10, color: 'rgba(183,156,255,0.8)', g: 0 });
      const r = { x: s.x - 3, y: s.y - 3, w: 6, h: 6 };
      for (const g of L.ghosts) {
        if (!g.dead && !game.noEnemies && overlaps(r, ghostBox(g))) { hitGhost(g, Math.sign(s.vx)); return false; }
      }
      if (blocks.some((b) => overlaps(r, b)) || s.life <= 0 || s.x < -10 || s.x > W + 10) {
        puff(s.x, s.y, 6, 'rgba(183,156,255,0.9)', 1.2, 8);
        return false;
      }
      return true;
    });
  }

  function stepFlames() {
    for (const f of L.flames) {
      if (f.taken) continue;
      if (overlaps(pbox(), { x: f.x - 5, y: f.y - 8, w: 10, h: 14 })) {
        f.taken = true;
        game.ammo = Math.min(9, game.ammo + 1);
        sfx('pickup');
        puff(f.x, f.y, 10, 'rgba(239,232,255,0.95)', 1.5);
      }
    }
  }

  function die() {
    if (game.mode !== 'play') return;
    game.mode = 'dead';
    game.deadT = 0;
    game.shake = 10;
    player.vy = -5;
    player.deadVX = -player.face * 0.8;
    sfx('hurt');
  }

  // =====================================================================
  // Jogador
  // =====================================================================
  function stepPlayer() {
    const p = player;

    if (p.onGround && p.standOn) {
      p.x += p.standOn.x - p.standOn.prevX;
      p.y += p.standOn.y - p.standOn.prevY;
    }

    const want = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const acc = p.onGround ? PHYS.accel : PHYS.airAccel;
    const max = p.pushing ? PHYS.pushRun : PHYS.maxRun;
    if (want) {
      p.vx = Math.max(-max, Math.min(max, p.vx + want * acc));
      p.face = want;
    } else if (p.onGround) {
      p.vx = Math.abs(p.vx) <= PHYS.friction ? 0 : p.vx - Math.sign(p.vx) * PHYS.friction;
    } else {
      p.vx *= 0.96;
    }

    p.coyote = p.onGround ? PHYS.coyote : Math.max(0, p.coyote - 1);
    p.buffer = jumpPressed ? PHYS.buffer : Math.max(0, p.buffer - 1);
    jumpPressed = false;
    if (p.buffer > 0 && p.coyote > 0) {
      p.vy = -PHYS.jump;
      p.buffer = 0; p.coyote = 0;
      p.onGround = false; p.standOn = null; p.airT = 0; p.landT = 0;
      puff(p.x + PW / 2, p.y + PH, 5);
      sfx('jump');
    }
    if (!keys.jump && p.vy < -2.2) p.vy *= PHYS.jumpCut;

    // eixo x: paredes, portões e caixas (que podem ser empurradas)
    p.x += p.vx;
    p.pushing = false;
    for (const s of walls()) {
      if (overlaps(p, s)) {
        if (p.vx > 0) p.x = s.x - PW; else if (p.vx < 0) p.x = s.x + s.w;
        p.vx = 0;
      }
    }
    for (const b of L.boxes) {
      if (!overlaps(pbox(), b)) continue;
      const sameLevel = p.onGround && Math.abs(p.y + PH - (b.y + BOX)) < 6;
      if (sameLevel && p.vx !== 0 && b.onGround) {
        const need = p.vx > 0 ? p.x + PW - b.x : p.x - (b.x + BOX);
        const moved = pushBox(b, need);
        if (moved !== 0 && game.t % 12 === 0) sfx('push');
        p.pushing = true;
      }
      if (overlaps(pbox(), b)) {
        if (p.x + PW / 2 < b.x + BOX / 2) p.x = b.x - PW; else p.x = b.x + BOX;
        if (!p.pushing) p.vx = 0;
      }
    }
    p.x = Math.max(0, Math.min(W - PW, p.x));

    // eixo y
    const wasGround = p.onGround;
    const prevBottom = p.y + PH;
    p.vy = Math.min(PHYS.maxFall, p.vy + PHYS.grav);
    p.y += p.vy;
    p.onGround = false;
    p.standOn = null;
    for (const s of [...walls(), ...L.boxes]) {
      if (!overlaps(p, s)) continue;
      if (p.vy >= 0 && prevBottom <= s.y + 0.5) { p.y = s.y - PH; p.vy = 0; p.onGround = true; }
      else if (p.vy < 0) { p.y = s.y + s.h; p.vy = 0; }
    }
    for (const pl of L.platforms) {
      if (!solidPlatform(pl)) continue;
      const within = p.x + PW > pl.x + 1 && p.x < pl.x + pl.w - 1;
      if (within && p.vy >= 0 && prevBottom <= pl.y + 0.5 && p.y + PH >= pl.y) {
        p.y = pl.y - PH; p.vy = 0; p.onGround = true; p.standOn = pl;
      }
    }
    if (p.standOn && p.standOn.crumble && p.standOn.t === 0) p.standOn.t = 1;
    if (p.onGround && !wasGround) {
      p.landT = 12;
      puff(p.x + PW / 2, p.y + PH, 6, 'rgba(216,207,245,0.75)', 1.6);
      sfx('land');
    }
    p.landT = Math.max(0, p.landT - 1);
    p.airT = p.onGround ? 0 : p.airT + 1;
    p.runT = p.onGround && Math.abs(p.vx) > 0.4 ? p.runT + 1 : 0;

    // fantasmas: pisar em cima derrota; encostar de outro jeito, perde
    if (!game.noEnemies) {
      for (const g of L.ghosts) {
        if (g.dead) continue;
        const gb = ghostBox(g);
        if (!overlaps(pbox(), gb)) continue;
        if (p.vy > 0 && prevBottom <= gb.y + 8) {
          hitGhost(g, p.face, true);
          p.vy = keys.jump ? -PHYS.jump : -5.6;
          p.onGround = false;
          p.airT = 0;
        } else {
          die();
          return;
        }
      }
    }

    if (p.y > H + 40) {
      game.deaths++;
      game.shake = 12;
      sfx('fall');
      loadLevel(game.level, true);
      return;
    }

    for (const lv of L.levers) {
      if (!lv.on && overlaps(pbox(), { x: lv.x - 2, y: lv.y - 18, w: 14, h: 18 })) {
        lv.on = true;
        game.shake = 6;
        sfx('lever');
        puff(lv.x + 5, lv.y - 14, 10, 'rgba(239,232,255,0.95)', 1.8);
      }
      if (lv.on) lv.anim = Math.min(1, lv.anim + 0.15);
    }

    // porta: abre quando o jogador se aproxima (mesmo vindo de baixo)
    const d = L.door;
    const cx = p.x + PW / 2;
    const dc = d.x + 12;
    const below = p.y + PH - d.y;
    const blockedByGate = L.gates.some((g) => gateRect(g).h > 0 && Math.min(cx, dc) < g.x + GATE_W && Math.max(cx, dc) > g.x && Math.abs(g.bottom - d.y) < 2);
    const near = Math.abs(cx - dc) < 90 && below > -6 && below < 40 && !blockedByGate;
    if (near && game.doorOpen === 0) sfx('door');
    if (near || game.doorOpen > 0) game.doorOpen = Math.min(1, game.doorOpen + 1 / 16);
    if (game.doorOpen >= 0.7 && p.onGround && Math.abs(cx - dc) < 11 && Math.abs(below) < 1) {
      game.mode = 'enter';
      p.enterT = 0;
      p.vx = 0;
    }
  }

  function stepWorld() {
    stepPower();
    stepPlatforms();
    stepGates();
    stepBoxes();
    if (!game.noEnemies) stepGhosts();
    stepShots();
  }

  function step() {
    game.t++;
    for (const c of clouds) { c.x += c.v; if (c.x > W + 20) c.x = -c.w * 14 - 20; }
    particles = particles.filter((q) => { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; return q.life > 0; });
    if (game.shake > 0) game.shake--;
    if (game.banner > 0) game.banner--;

    if (game.mode === 'title' || game.mode === 'end') {
      if (jumpPressed) {
        jumpPressed = false;
        sfx('start');
        game.deaths = 0;
        game.frames = 0;
        loadLevel(0);
        game.mode = 'iris-in';
        game.iris = 0;
      }
      firePressed = false;
      return;
    }
    if (game.mode === 'play') {
      game.frames++;
      stepWorld();
      stepPlayer();
      if (game.mode === 'play') stepFlames();
      if (game.doorOpen > 0 && game.t % 4 === 0) {
        particles.push({ x: L.door.x + 4 + Math.random() * 16, y: L.door.y - 6 - Math.random() * 28, vx: 0, vy: -0.3, life: 34, color: 'rgba(239,232,255,0.9)', g: 0 });
      }
      return;
    }
    if (game.mode === 'dead') {
      game.frames++;
      game.deadT++;
      stepWorld();
      player.x += player.deadVX;
      player.y += player.vy;
      player.vy += PHYS.grav * 0.6;
      if (game.deadT > 50) {
        game.deaths++;
        loadLevel(game.level, true);
        game.mode = 'play';
      }
      return;
    }
    if (game.mode === 'enter') {
      const p = player;
      p.enterT++;
      p.x += (L.door.x + 12 - PW / 2 - p.x) * 0.2;
      p.vx = 0;
      p.fade = Math.max(0, 1 - Math.max(0, p.enterT - 8) / 12);
      stepWorld();
      if (p.enterT > 22) p.hidden = true;
      if (p.enterT > 30) { game.mode = 'iris-out'; game.iris = 1; }
      return;
    }
    if (game.mode === 'iris-out') {
      game.iris = Math.max(0, game.iris - 1 / 32);
      if (game.iris === 0) {
        if (game.level + 1 < LEVELS.length) { loadLevel(game.level + 1); game.mode = 'iris-in'; }
        else { game.mode = 'end'; game.iris = 1; }
      }
      return;
    }
    if (game.mode === 'iris-in') {
      game.iris = Math.min(1, game.iris + 1 / 28);
      if (game.iris === 1) game.mode = 'play';
      jumpPressed = false;
      firePressed = false;
    }
  }

  // =====================================================================
  // Render
  // =====================================================================
  function render() {
    const t = game.t;
    ctx.save();
    if (game.shake) ctx.translate(Math.round((Math.random() * 2 - 1) * 2), Math.round((Math.random() * 2 - 1) * 2));
    ctx.drawImage(bg, 0, 0);
    for (const s of stars) {
      const tw = Math.sin(t * 0.04 + s.p);
      ctx.fillStyle = tw > 0.2 ? 'rgba(243,238,255,0.95)' : 'rgba(243,238,255,0.35)';
      ctx.fillRect(s.x, s.y, 1, 1);
      if (s.big && tw > 0.6) {
        ctx.fillStyle = 'rgba(243,238,255,0.4)';
        ctx.fillRect(s.x - 1, s.y, 3, 1);
        ctx.fillRect(s.x, s.y - 1, 1, 3);
      }
    }
    for (const c of clouds) drawCloud(c.x, c.y, c.w);

    if (!L) loadLevel(0);
    drawWires(t);
    for (const pl of L.platforms) drawRails(pl);
    for (const s of L.solids) drawSolid(s);
    for (const g of L.gates) drawGate(g, t);
    for (const pl of L.platforms) drawPlatform(pl, t);
    for (const pl of L.plates) drawPlate(pl);
    for (const lv of L.levers) drawLever(lv, t);
    drawDoor(L.door, game.doorOpen, t);
    for (const b of L.boxes) drawBox(b);
    for (const f of L.flames) if (!f.taken) drawFlame(f.x, f.y + Math.sin(t * 0.08) * 2, t);
    if (!game.noEnemies) for (const g of L.ghosts) drawGhostEnemy(g, t);
    for (const q of particles) {
      ctx.fillStyle = q.color;
      ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 1);
    }
    for (const s of L.shots) drawShot(s, t);
    if (game.mode !== 'title') drawPlayer(player, t);
    ctx.restore();

    if (['play', 'enter', 'iris-in', 'dead'].includes(game.mode)) {
      drawText(L.name, 8, 8, { s: 2 });
      drawText(`QUEDAS ${game.deaths}`, W - 8, 8, { s: 2, align: 'right' });
      if (L.ammo != null) {
        const sx = game.ammoShake ? (game.ammoShake % 4 < 2 ? 2 : -2) : 0;
        if (game.ammo === 0) drawText('SEM FOGO', 8 + sx, 26, { color: game.ammoShake ? C.lilacHot : C.textDim });
        for (let i = 0; i < game.ammo; i++) drawFlame(12 + i * 10 + sx, 32, t);
      }
      if (game.banner > 0) {
        ctx.globalAlpha = Math.min(1, game.banner / 30);
        drawText(L.name, W / 2, 30, { s: 5, align: 'center' });
        drawText(L.tip, W / 2, 62, { s: 2, align: 'center', color: C.accent });
        if (game.level === 0) drawText('< > ANDAR     ESPAÇO PULAR', W / 2, 78, { align: 'center', color: C.textDim });
        if (game.level === 4) drawText('X ATIRA - O FOGO É POUCO, PULAR EM CIMA NÃO GASTA', W / 2, 78, { align: 'center', color: C.textDim });
        ctx.globalAlpha = 1;
      }
    }

    if (game.mode === 'iris-out' || game.mode === 'iris-in') {
      const cx = player.x + PW / 2, cy = player.y + PH / 2;
      ctx.fillStyle = C.ink;
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.arc(cx, cy, Math.max(0, game.iris) * 560, 0, Math.PI * 2, true);
      ctx.fill();
    }

    if (game.mode === 'title') {
      ctx.fillStyle = 'rgba(12,10,22,0.72)';
      ctx.fillRect(0, 0, W, H);
      drawText('LÁ EM CIMA', W / 2, 40, { s: 6, align: 'center' });
      drawText('UM PEQUENO JOGO DE PULAR NA NOITE', W / 2, 84, { s: 2, align: 'center', color: C.accent });
      drawSprite('player', 'idle', Math.floor(t / 11) % 4, W / 2 - 30, 196, 1, 2);
      drawSprite('ghost', 'float', Math.floor(t / 7) % 8, W / 2 + 46, 140 + Math.sin(t * 0.06) * 4, -1, 1.5);
      if (Math.floor(t / 30) % 2 === 0) drawText('APERTE ESPAÇO OU TOQUE PARA COMEÇAR', W / 2, 214, { s: 2, align: 'center' });
      drawText('SETAS ANDAM - ESPAÇO PULA - X ATIRA - M SOM', W / 2, 240, { align: 'center', color: C.textDim });
    }

    if (game.mode === 'end') {
      ctx.fillStyle = 'rgba(12,10,22,0.85)';
      ctx.fillRect(0, 0, W, H);
      drawText('VOCÊ CHEGOU', W / 2, 40, { s: 5, align: 'center' });
      drawText('LÁ EM CIMA!', W / 2, 74, { s: 5, align: 'center', color: C.accent });
      drawSprite('player', 'land', 4, W / 2, 168, 1, 1.5);
      const secs = Math.floor(game.frames / 60);
      drawText(`TEMPO ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}     QUEDAS ${game.deaths}`, W / 2, 184, { s: 2, align: 'center' });
      drawText('MAIS FASES EM BREVE', W / 2, 206, { align: 'center', color: C.textDim });
      if (Math.floor(t / 30) % 2 === 0) drawText('ESPAÇO OU TOQUE PARA JOGAR DE NOVO', W / 2, 228, { s: 2, align: 'center' });
    }
  }

  // =====================================================================
  // Entrada
  // =====================================================================
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', Enter: 'jump',
    KeyX: 'fire', KeyJ: 'fire', KeyF: 'fire', KeyK: 'fire',
  };
  function setKey(k, down) {
    if (k === 'jump' && down && !keys.jump) jumpPressed = true;
    if (k === 'fire' && down && !keys.fire) firePressed = true;
    keys[k] = down;
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyM') { muted = !muted; return; }
    const k = KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (!e.repeat) setKey(k, true);
  });
  window.addEventListener('keyup', (e) => {
    const k = KEYMAP[e.code];
    if (k) setKey(k, false);
  });
  window.addEventListener('blur', () => { keys.left = keys.right = keys.jump = keys.fire = false; });

  document.querySelectorAll('.pad button').forEach((b) => {
    const k = b.dataset.key;
    const on = (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch {} b.classList.add('on'); setKey(k, true); };
    const off = (e) => { e.preventDefault(); b.classList.remove('on'); setKey(k, false); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  });
  canvas.addEventListener('pointerdown', () => {
    if (game.mode === 'title' || game.mode === 'end') jumpPressed = true;
  });

  // =====================================================================
  // Laço com passo fixo
  // =====================================================================
  let last = performance.now();
  let acc = 0;
  let paused = false;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused) { last = now; return; }
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= DT) { step(); acc -= DT; }
    render();
  }
  loadLevel(0);
  requestAnimationFrame(frame);

  // Gancho para testes automatizados (avança quadros de forma determinística).
  window.jogo = {
    W, H, PW, PH, BOX, levels: LEVELS.length,
    pause() { paused = true; },
    resume() { paused = false; },
    key(k, down) { setKey(k, down); },
    step(n = 1) { for (let i = 0; i < n; i++) step(); render(); },
    teleport(x, y) { Object.assign(player, { x, y, vx: 0, vy: 0, onGround: false, standOn: null }); },
    goto(i) { loadLevel(i); game.mode = 'play'; game.iris = 1; game.banner = 0; },
    enemies(on) { game.noEnemies = !on; },
    moveGhost(i, x, y) { const g = L.ghosts[i]; Object.assign(g, { hx: x, hy: y, x, y, ox: 0, from: x, to: x, speed: 0 }); },
    state() {
      return {
        mode: game.mode, level: game.level, deaths: game.deaths, doorOpen: game.doorOpen, power: { ...game.power },
        x: player.x, y: player.y, vy: player.vy, onGround: player.onGround, face: player.face, anim: playerFrame(player, game.t)[0],
        standOn: player.standOn ? L.platforms.indexOf(player.standOn) : (player.onGround ? 'chão' : null),
        platforms: L.platforms.map((p) => ({ x: p.x, y: p.y, w: p.w, solid: solidPlatform(p), gone: !!p.gone })),
        door: L.door,
        levers: L.levers.map((l) => ({ x: l.x, y: l.y, ch: l.ch, on: l.on })),
        plates: L.plates.map((p) => ({ x: p.x, y: p.y, down: p.down })),
        gates: L.gates.map((g) => ({ x: g.x, open: g.open })),
        boxes: L.boxes.map((b) => ({ x: b.x, y: b.y, onGround: !!b.onGround })),
        ghosts: L.ghosts.map((g) => ({ x: g.x, y: g.y, hp: g.hp, dead: g.dead, flash: g.flash, kx: g.kx, ox: g.ox })),
        ammo: game.ammo, shots: L.shots.length, flames: L.flames.filter((f) => !f.taken).length,
        spriteReady: Object.values(sheets).every((s) => s.im.complete && s.im.naturalWidth > 0 && s.white),
      };
    },
  };
}
</script>
</body>
</html>
